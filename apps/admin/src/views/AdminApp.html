<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { --ink:#17202a; --muted:#64748b; --brand:#0f766e; --brand-dark:#115e59; --surface:#fff; --bg:#f5f7f7; --line:#dce7e5; --danger:#b91c1c; --success:#166534; }
    * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--ink); font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button,input,select { font:inherit; } button { border:0; border-radius:10px; padding:10px 13px; cursor:pointer; } button.primary { background:var(--brand); color:#fff; font-weight:700; } button.secondary { background:#fff; border:1px solid var(--line); } button.danger { background:#fee2e2; color:var(--danger); } button.small { padding:7px 9px; font-size:.84rem; } button:disabled { opacity:.55; }
    .shell { display:grid; grid-template-columns:240px minmax(0,1fr); min-height:100vh; } aside { background:#102a29; color:#e8fffb; padding:22px 14px; } .brand { font-size:1.25rem; font-weight:800; padding:0 10px 24px; } .brand span { color:#5eead4; } nav { display:grid; gap:5px; } nav button { text-align:left; color:#cde9e5; background:transparent; } nav button.active, nav button:hover { background:#1d4d49; color:#fff; } main { padding:28px clamp(16px,4vw,46px) 48px; max-width:1400px; width:100%; margin:0 auto; } header { display:flex; gap:14px; align-items:flex-start; justify-content:space-between; margin-bottom:24px; } h1,h2,h3 { margin:0 0 8px; letter-spacing:-.02em; } h1 { font-size:clamp(1.6rem,4vw,2.3rem); } h2 { font-size:1.25rem; } p { color:var(--muted); line-height:1.5; } .muted { color:var(--muted); } .stack { display:grid; gap:14px; } .grid { display:grid; gap:14px; } .cards { grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); } .card { background:#fff; border:1px solid var(--line); border-radius:15px; padding:17px; box-shadow:0 4px 18px rgba(15,23,42,.06); } .metric strong { font-size:1.65rem; display:block; margin-top:8px; } .metric small { color:var(--muted); } .toolbar,.row { display:flex; gap:9px; align-items:center; flex-wrap:wrap; } .between { justify-content:space-between; } label { display:grid; gap:5px; font-size:.9rem; font-weight:650; } input,select { border:1px solid #c8d8d5; border-radius:9px; padding:10px 11px; background:#fff; color:var(--ink); width:100%; } .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; } .full { grid-column:1/-1; } table { width:100%; border-collapse:collapse; font-size:.9rem; } th,td { padding:11px 8px; border-bottom:1px solid #edf2f1; text-align:left; vertical-align:top; } th { color:var(--muted); font-size:.8rem; text-transform:uppercase; letter-spacing:.04em; } .table-wrap { overflow:auto; } .pill { display:inline-block; border-radius:999px; padding:4px 8px; font-size:.75rem; font-weight:700; background:#e6f6f3; color:var(--brand-dark); } .pill.danger { background:#fee2e2; color:var(--danger); } .pill.warning { background:#fff7ed; color:#9a3412; } .notice { border-radius:11px; padding:12px 14px; } .notice.info { background:#eff6ff; color:#1e40af; } .notice.error { background:#fef2f2; color:var(--danger); } .notice.success { background:#f0fdf4; color:var(--success); } .hidden { display:none !important; } .bar { height:10px; border-radius:999px; background:#ccfbf1; overflow:hidden; } .bar span { display:block; height:100%; background:var(--brand); } .day-row { display:grid; grid-template-columns:100px 1fr 130px; gap:12px; align-items:center; padding:9px 0; border-bottom:1px solid #edf2f1; } .day-row input[type=checkbox] { width:auto; } .day-row .times { display:flex; gap:8px; } .empty { color:var(--muted); padding:20px 0; } .setup { max-width:700px; margin:8vh auto; } @media(max-width:760px) { .shell { grid-template-columns:1fr; } aside { padding:12px; } nav { display:flex; overflow:auto; } nav button { white-space:nowrap; } main { padding:20px 14px 40px; } header { flex-direction:column; } .form-grid { grid-template-columns:1fr; } .full { grid-column:auto; } .day-row { grid-template-columns:1fr; gap:7px; } }
  </style>
</head>
<body>
  <div class="shell">
    <aside><div class="brand">Barber <span>Admin</span></div><nav id="nav"><button data-tab="dashboard" onclick="showTab('dashboard')">Dashboard</button><button data-tab="agenda" onclick="showTab('agenda')">Agenda</button><button data-tab="clients" onclick="showTab('clients')">Clientes</button><button data-tab="services" onclick="showTab('services')">Serviços</button><button data-tab="availability" onclick="showTab('availability')">Disponibilidade</button><button data-tab="finance" onclick="showTab('finance')">Financeiro</button><button data-tab="settings" onclick="showTab('settings')">Configurações</button></nav></aside>
    <main><header><div><h1 id="page-title">Painel</h1><p id="page-subtitle">Carregando…</p></div><button class="secondary" onclick="refreshCurrent()">Atualizar</button></header><div id="app"><div class="card">Carregando painel…</div></div></main>
  </div>
  <script>
    const state = { bootstrap:null, tab:'dashboard', dashboard:null, agenda:[], clients:[], settings:null, schedule:null, services:[] };
    const dayNames = {1:'Segunda',2:'Terça',3:'Quarta',4:'Quinta',5:'Sexta',6:'Sábado',7:'Domingo'};
    function esc(value) { return String(value == null ? '' : value).replace(/[&<>'"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]; }); }
    function money(value) { return Number(value || 0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
    function today() { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
    function callServer(name,payload) { return new Promise(function(resolve){ const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(function(e){resolve({ok:false,error:{message:e&&e.message?e.message:'Erro de comunicação.'}});}); if(payload===undefined) runner[name](); else runner[name](payload); }); }
    function unwrap(result) { if(!result || !result.ok) throw new Error(result && result.error ? result.error.message : 'Não foi possível concluir a operação.'); return result.data; }
    function errorBox(message) { return '<div class="notice error">'+esc(message)+'</div>'; }
    function successBox(message) { return '<div class="notice success">'+esc(message)+'</div>'; }
    function showTab(tab) { state.tab=tab; document.querySelectorAll('#nav button').forEach(function(button){button.classList.toggle('active',button.dataset.tab===tab);}); renderTab(); }
    function setHeader(title,subtitle) { document.getElementById('page-title').textContent=title; document.getElementById('page-subtitle').textContent=subtitle||''; }
    function renderTab() { if(!state.bootstrap || !state.bootstrap.configured) return; const views={dashboard:dashboardView,agenda:agendaView,clients:clientsView,services:servicesView,availability:availabilityView,finance:financeView,settings:settingsView}; views[state.tab](); }
    function metric(label,value,detail) { return '<div class="card metric"><small>'+esc(label)+'</small><strong>'+esc(value)+'</strong><small>'+esc(detail||'')+'</small></div>'; }
    function dashboardView() { setHeader('Dashboard','Visão geral dos atendimentos e do faturamento.'); document.getElementById('app').innerHTML='<div class="card toolbar"><label>Período<select id="dashboard-filter" onchange="loadDashboard()"><option value="today">Hoje</option><option value="week">Esta semana</option><option value="month">Este mês</option><option value="custom">Personalizado</option></select></label><div id="custom-range" class="toolbar hidden"><label>De<input id="dashboard-from" type="date"></label><label>Até<input id="dashboard-to" type="date"></label></div><button class="primary" onclick="loadDashboard()">Aplicar</button></div><div id="dashboard-content" class="stack" style="margin-top:14px"><div class="card">Carregando…</div></div>'; loadDashboard(); }
    async function loadDashboard() { try { const filter=document.getElementById('dashboard-filter').value; document.getElementById('custom-range').classList.toggle('hidden',filter!=='custom'); const payload={filter:filter}; if(filter==='custom'){payload.from=document.getElementById('dashboard-from').value;payload.to=document.getElementById('dashboard-to').value;} state.dashboard=unwrap(await callServer('adminGetDashboard',payload)); const d=state.dashboard; const c=d.cards; document.getElementById('dashboard-content').innerHTML='<div class="grid cards">'+metric('Atendimentos concluídos',c.completed,'No período')+metric('Agendados',c.scheduled,'Ativos')+metric('Cancelamentos',c.cancellations,'No período')+metric('No-show',c.noShow,'No período')+metric('Faturamento',money(c.revenue),'Concluídos')+metric('Previsto',money(c.expectedRevenue),'Agendados')+metric('Ticket médio',money(c.averageTicket),'Concluídos')+metric('Clientes',c.clientsServed,c.newClients+' novos · '+c.returningClients+' recorrentes')+'</div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:14px"><section class="card"><h2>Serviços</h2>'+serviceStatsHtml(d.serviceStats)+'</section><section class="card"><h2>Atendimentos por período</h2>'+timelineHtml(d.timeline)+'</section></div>'; } catch(e){ document.getElementById('dashboard-content').innerHTML=errorBox(e.message); } }
    function serviceStatsHtml(items) { if(!items.length)return '<div class="empty">Sem dados no período.</div>'; return '<div class="table-wrap"><table><thead><tr><th>Serviço</th><th>Qtd.</th><th>Receita</th></tr></thead><tbody>'+items.map(function(i){return '<tr><td>'+esc(i.serviceName)+'</td><td>'+i.quantity+'</td><td>'+money(i.revenue)+'</td></tr>';}).join('')+'</tbody></table></div>'; }
    function timelineHtml(items) { if(!items.length)return '<div class="empty">Sem dados no período.</div>'; const max=Math.max.apply(null,items.map(function(i){return i.appointments;} ).concat([1])); return items.slice(-31).map(function(i){return '<div class="day-row"><span>'+esc(i.date)+'</span><div class="bar"><span style="width:'+Math.round(i.appointments/max*100)+'%"></span></div><strong>'+i.appointments+' · '+money(i.revenue)+'</strong></div>';}).join(''); }
    function agendaView() { setHeader('Agenda','Acompanhe os atendimentos e atualize o status.'); document.getElementById('app').innerHTML='<div class="card toolbar"><label>De<input id="agenda-from" type="date" value="'+today()+'"></label><label>Até<input id="agenda-to" type="date" value="'+today()+'"></label><button class="primary" onclick="loadAgenda()">Consultar</button></div><div id="agenda-content" class="card" style="margin-top:14px">Carregando…</div>'; loadAgenda(); }
    async function loadAgenda() { try { const data=unwrap(await callServer('adminGetAgenda',{from:document.getElementById('agenda-from').value,to:document.getElementById('agenda-to').value})); state.agenda=data; document.getElementById('agenda-content').innerHTML=agendaHtml(data); } catch(e){document.getElementById('agenda-content').innerHTML=errorBox(e.message);} }
    function agendaHtml(items) { if(!items.length)return '<div class="empty">Nenhum atendimento no período.</div>'; return '<div class="table-wrap"><table><thead><tr><th>Data/horário</th><th>Cliente</th><th>Serviço</th><th>Status</th><th>Ações</th></tr></thead><tbody>'+items.map(function(i){const pill=i.status.indexOf('CANCELLED')===0?'danger':i.status==='COMPLETED'?'':'warning';return '<tr><td><strong>'+esc(i.date)+'</strong><br>'+esc(i.startTime)+'–'+esc(i.endTime)+'</td><td>'+esc(i.clientName)+'<br><span class="muted">'+esc(i.clientPhone)+'</span></td><td>'+esc(i.serviceName)+'<br>'+money(i.servicePrice)+'</td><td><span class="pill '+pill+'">'+esc(i.status)+'</span></td><td><div class="row">'+(['CONFIRMED','PENDING'].indexOf(i.status)>=0?'<button class="small primary" onclick="completeAppointment(\''+i.id+'\')">Concluir</button><button class="small danger" onclick="updateAppointment(\''+i.id+'\',\'CANCELLED_BY_BARBER\')">Cancelar</button><button class="small secondary" onclick="updateAppointment(\''+i.id+'\',\'NO_SHOW\')">No-show</button><button class="small secondary" onclick="rescheduleAdminAppointment(\''+i.id+'\')">Remarcar</button>':'')+'</div></td></tr>';}).join('')+'</tbody></table></div>'; }
    async function updateAppointment(id,status,paymentStatus,paymentMethod) { try { const result=unwrap(await callServer('adminUpdateAppointment',{id:id,status:status,paymentStatus:paymentStatus,paymentMethod:paymentMethod})); state.agenda=state.agenda.map(function(i){return i.id===id?result:i;}); document.getElementById('agenda-content').innerHTML=agendaHtml(state.agenda); } catch(e){alert(e.message);} }
    async function completeAppointment(id) { const method=prompt('Forma de pagamento: PIX, DINHEIRO, CARTÃO ou OUTRO','PIX'); if(method===null)return; const normalized=method.trim().toUpperCase(); if(['PIX','DINHEIRO','CARTÃO','OUTRO'].indexOf(normalized)<0){alert('Forma de pagamento inválida.');return;} await updateAppointment(id,'COMPLETED','PAID',normalized); }
    async function rescheduleAdminAppointment(id) { const date=prompt('Nova data (AAAA-MM-DD)',today()); if(!date)return; const time=prompt('Novo horário (HH:MM)','09:00'); if(!time)return; try { unwrap(await callServer('adminRescheduleAppointment',{appointmentId:id,date:date,startTime:time})); await loadAgenda(); } catch(e){alert(e.message);} }
    function servicesView() { setHeader('Serviços','Cadastre serviços e preserve snapshots nos atendimentos.'); document.getElementById('app').innerHTML='<div class="grid" style="grid-template-columns:minmax(260px,360px) minmax(0,1fr)"><section class="card stack"><h2 id="service-form-title">Novo serviço</h2><input id="service-id" type="hidden"><label>Nome<input id="service-name" maxlength="100"></label><label>Descrição<textarea id="service-description" rows="3" style="font:inherit;border:1px solid #c8d8d5;border-radius:9px;padding:10px"></textarea></label><label>Duração (minutos)<input id="service-duration" type="number" min="5" max="480" value="40"></label><label>Preço<input id="service-price" type="number" min="0" step="0.01" value="0"></label><label><span>Ativo</span><input id="service-active" type="checkbox" checked style="width:auto"></label><div class="row"><button class="primary" onclick="saveService()">Salvar</button><button class="secondary" onclick="resetServiceForm()">Limpar</button></div><div id="service-message"></div></section><section class="card"><div id="services-table">Carregando…</div></section></div>'; loadServices(); }
    async function loadServices() { try { state.services=unwrap(await callServer('adminListServices')); document.getElementById('services-table').innerHTML=servicesTableHtml(); } catch(e){document.getElementById('services-table').innerHTML=errorBox(e.message);} }
    function servicesTableHtml() { if(!state.services.length)return '<div class="empty">Nenhum serviço cadastrado.</div>'; return '<div class="table-wrap"><table><thead><tr><th>Nome</th><th>Duração</th><th>Preço</th><th>Status</th><th></th></tr></thead><tbody>'+state.services.map(function(s){return '<tr><td><strong>'+esc(s.name)+'</strong><br><span class="muted">'+esc(s.description)+'</span></td><td>'+s.durationMinutes+' min</td><td>'+money(s.price)+'</td><td><span class="pill '+(s.active?'':'danger')+'">'+(s.active?'ATIVO':'INATIVO')+'</span></td><td><button class="small secondary" onclick="editService(\''+s.id+'\')">Editar</button></td></tr>';}).join('')+'</tbody></table></div>'; }
    function editService(id) { const s=state.services.find(function(i){return i.id===id;}); if(!s)return; document.getElementById('service-form-title').textContent='Editar serviço'; document.getElementById('service-id').value=s.id; document.getElementById('service-name').value=s.name; document.getElementById('service-description').value=s.description||''; document.getElementById('service-duration').value=s.durationMinutes; document.getElementById('service-price').value=s.price; document.getElementById('service-active').checked=s.active; window.scrollTo({top:0,behavior:'smooth'}); }
    function resetServiceForm(){['service-id','service-name','service-description'].forEach(function(id){document.getElementById(id).value='';});document.getElementById('service-duration').value=40;document.getElementById('service-price').value=0;document.getElementById('service-active').checked=true;document.getElementById('service-form-title').textContent='Novo serviço';}
    async function saveService(){ try { const saved=unwrap(await callServer('adminSaveService',{id:document.getElementById('service-id').value,name:document.getElementById('service-name').value,description:document.getElementById('service-description').value,durationMinutes:document.getElementById('service-duration').value,price:document.getElementById('service-price').value,active:document.getElementById('service-active').checked})); document.getElementById('service-message').innerHTML=successBox('Serviço salvo.'); resetServiceForm(); await loadServices(); } catch(e){document.getElementById('service-message').innerHTML=errorBox(e.message);} }
    function availabilityView(){ setHeader('Disponibilidade','Defina horários padrão, exceções e bloqueios.'); document.getElementById('app').innerHTML='<div id="availability-content" class="stack"><div class="card">Carregando…</div></div>'; loadSchedule(); }
    async function loadSchedule(){ try{state.schedule=unwrap(await callServer('adminGetSchedule')); renderAvailability();}catch(e){document.getElementById('availability-content').innerHTML=errorBox(e.message);} }
    function renderAvailability(){ const s=state.schedule; document.getElementById('availability-content').innerHTML='<section class="card stack"><div class="between row"><h2>Horário padrão</h2><button class="primary" onclick="saveSchedule()">Salvar horários</button></div><div>'+s.workSchedule.map(function(r){return '<div class="day-row"><label><span>'+dayNames[r.weekday]+'</span><input type="checkbox" data-weekday="'+r.weekday+'" class="schedule-enabled" '+(r.enabled?'checked':'')+'></label><div class="times"><input type="time" data-start="'+r.weekday+'" value="'+esc(r.startTime)+'" '+(r.enabled?'':'disabled')+'><input type="time" data-end="'+r.weekday+'" value="'+esc(r.endTime)+'" '+(r.enabled?'':'disabled')+'></div><span class="muted">'+(r.enabled?'Aberto':'Fechado')+'</span></div>';}).join('')+'</div></section><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><section class="card stack"><h2>Exceção de data</h2><div class="form-grid"><label>Data<input id="override-date" type="date"></label><label>Aberto<input id="override-enabled" type="checkbox" checked style="width:auto"></label><label>Início<input id="override-start" type="time" value="09:00"></label><label>Fim<input id="override-end" type="time" value="19:00"></label></div><button class="primary" onclick="saveOverride()">Adicionar exceção</button><div>'+s.overrides.map(function(o){return '<div class="row between" style="padding:8px 0;border-bottom:1px solid #edf2f1"><span>'+o.date+' · '+(o.enabled?o.startTime+'–'+o.endTime:'Fechado')+'</span><button class="small danger" onclick="deleteOverride(\''+o.id+'\')">Excluir</button></div>';}).join('')+'</div></section><section class="card stack"><h2>Bloqueio de intervalo</h2><div class="form-grid"><label>Data<input id="block-date" type="date"></label><label>Motivo<input id="block-reason" maxlength="200"></label><label>Início<input id="block-start" type="time" value="12:00"></label><label>Fim<input id="block-end" type="time" value="14:00"></label></div><button class="primary" onclick="saveBlock()">Adicionar bloqueio</button><div>'+s.blocks.map(function(b){return '<div class="row between" style="padding:8px 0;border-bottom:1px solid #edf2f1"><span>'+b.date+' · '+b.startTime+'–'+b.endTime+'<br><small class="muted">'+esc(b.reason)+'</small></span><button class="small danger" onclick="deleteBlock(\''+b.id+'\')">Excluir</button></div>';}).join('')+'</div></section></div>'; document.querySelectorAll('.schedule-enabled').forEach(function(cb){cb.addEventListener('change',function(){const day=cb.dataset.weekday;document.querySelector('[data-start="'+day+'"]').disabled=!cb.checked;document.querySelector('[data-end="'+day+'"]').disabled=!cb.checked;});}); }
    async function saveSchedule(){ try{const rows=Array.from(document.querySelectorAll('.schedule-enabled')).map(function(cb){const d=cb.dataset.weekday;return {weekday:d,enabled:cb.checked,startTime:document.querySelector('[data-start="'+d+'"]').value,endTime:document.querySelector('[data-end="'+d+'"]').value};});state.schedule=unwrap(await callServer('adminSaveWorkSchedule',{rows:rows}));renderAvailability();}catch(e){alert(e.message);} }
    async function saveOverride(){try{state.schedule=unwrap(await callServer('adminSaveScheduleOverride',{date:document.getElementById('override-date').value,enabled:document.getElementById('override-enabled').checked,startTime:document.getElementById('override-start').value,endTime:document.getElementById('override-end').value}));renderAvailability();}catch(e){alert(e.message);}}
    async function deleteOverride(id){if(!confirm('Excluir esta exceção?'))return;try{state.schedule=unwrap(await callServer('adminDeleteScheduleOverride',id));renderAvailability();}catch(e){alert(e.message);}}
    async function saveBlock(){try{state.schedule=unwrap(await callServer('adminSaveBlock',{date:document.getElementById('block-date').value,startTime:document.getElementById('block-start').value,endTime:document.getElementById('block-end').value,reason:document.getElementById('block-reason').value}));renderAvailability();}catch(e){alert(e.message);}}
    async function deleteBlock(id){if(!confirm('Excluir este bloqueio?'))return;try{state.schedule=unwrap(await callServer('adminDeleteBlock',id));renderAvailability();}catch(e){alert(e.message);}}
    function clientsView(){setHeader('Clientes','Histórico de clientes e atendimentos.');document.getElementById('app').innerHTML='<div class="card toolbar"><input id="client-search" placeholder="Buscar por nome, telefone ou e-mail"><button class="primary" onclick="loadClients()">Buscar</button></div><div id="clients-content" class="card" style="margin-top:14px">Carregando…</div>';loadClients();}
    async function loadClients(){try{state.clients=unwrap(await callServer('adminListClients',{query:document.getElementById('client-search').value}));document.getElementById('clients-content').innerHTML=state.clients.length?'<div class="table-wrap"><table><thead><tr><th>Cliente</th><th>Contato</th><th>Agendamentos</th><th></th></tr></thead><tbody>'+state.clients.map(function(c){return '<tr><td><strong>'+esc(c.name)+'</strong><br><span class="muted">'+(c.emailVerified?'E-mail verificado':'E-mail não verificado')+'</span></td><td>'+esc(c.phone)+'<br>'+esc(c.email)+'</td><td>'+c.appointmentsCount+' total<br>'+c.completedCount+' concluídos</td><td><button class="small secondary" onclick="clientHistory(\''+c.id+'\')">Histórico</button></td></tr>';}).join('')+'</tbody></table></div>':'<div class="empty">Nenhum cliente encontrado.</div>';}catch(e){document.getElementById('clients-content').innerHTML=errorBox(e.message);}}
    async function clientHistory(id){try{const data=unwrap(await callServer('adminGetClientHistory',id));document.getElementById('clients-content').innerHTML='<button class="secondary" onclick="loadClients()">← Voltar</button><div class="card" style="margin-top:12px"><h2>'+esc(data.client.name)+'</h2><p>'+esc(data.client.phone)+' · '+esc(data.client.email)+'</p>'+agendaHtml(data.appointments)+'</div>';}catch(e){alert(e.message);}}
    function financeView(){setHeader('Financeiro','Acompanhe faturamento, previsto e formas de pagamento.');document.getElementById('app').innerHTML='<div class="card toolbar"><label>Período<select id="finance-filter"><option value="today">Hoje</option><option value="week">Esta semana</option><option value="month" selected>Este mês</option></select></label><button class="primary" onclick="loadFinance()">Aplicar</button></div><div id="finance-content" class="stack" style="margin-top:14px">Carregando…</div>';loadFinance();}
    async function loadFinance(){try{const d=unwrap(await callServer('adminGetDashboard',{filter:document.getElementById('finance-filter').value}));const c=d.cards;document.getElementById('finance-content').innerHTML='<div class="grid cards">'+metric('Faturamento',money(c.revenue),'Atendimentos concluídos')+metric('Faturamento previsto',money(c.expectedRevenue),'Agendamentos ativos')+metric('Ticket médio',money(c.averageTicket),'Por atendimento concluído')+'</div><section class="card"><h2>Receita por serviço</h2>'+serviceStatsHtml(d.serviceStats)+'</section>'; }catch(e){document.getElementById('finance-content').innerHTML=errorBox(e.message);}}
    function settingsView(){setHeader('Configurações','Valores operacionais usados pelo sistema.');const s=state.settings||state.bootstrap.settings||{};document.getElementById('app').innerHTML='<section class="card stack"><div class="notice info">A base Google Sheets é a fonte oficial. IDs e permissões são configurados no Apps Script.</div><div class="form-grid"><label>Nome da barbearia<input id="set-name" value="'+esc(s.BARBER_NAME||'')+'"></label><label>E-mail do barbeiro<input id="set-email" type="email" value="'+esc(s.BARBER_EMAIL||'')+'"></label><label>Calendar ID<input id="set-calendar" value="'+esc(s.CALENDAR_ID||'primary')+'"></label><label>URL do Public Web App<input id="set-public-url" placeholder="https://script.google.com/..." value="'+esc(s.PUBLIC_APP_URL||'')+'"></label><label>Máx. agendamentos por cliente<input id="set-max" type="number" min="1" value="'+(s.MAX_ACTIVE_APPOINTMENTS_PER_CLIENT||2)+'"></label><label>Dias de antecedência<input id="set-days" type="number" min="1" value="'+(s.BOOKING_ADVANCE_DAYS||60)+'"></label><label>Antecedência mínima (min)<input id="set-minutes" type="number" min="1" value="'+(s.MIN_BOOKING_ADVANCE_MINUTES||30)+'"></label><label>Expiração OTP (min)<input id="set-otp" type="number" min="1" value="'+(s.OTP_EXPIRATION_MINUTES||10)+'"></label><label>Intervalo dos horários (min)<input id="set-slot" type="number" min="5" value="'+(s.SLOT_INTERVAL_MINUTES||30)+'"></label><label>Exigir confirmação de e-mail<select id="set-verify"><option value="true" '+(s.REQUIRE_EMAIL_VERIFICATION?'selected':'')+'>Sim</option><option value="false" '+(!s.REQUIRE_EMAIL_VERIFICATION?'selected':'')+'>Não</option></select></label><label>Fuso horário<input id="set-timezone" value="'+esc(s.BUSINESS_TIMEZONE||'America/Sao_Paulo')+'"></label></div><div id="settings-message"></div><button class="primary" onclick="saveSettings()">Salvar configurações</button></section><section class="card" style="margin-top:14px"><h2>Status técnico</h2><p>Spreadsheet configurada: '+(s.SPREADSHEET_CONFIGURED?'sim':'não')+'<br>Calendar: '+esc(s.CALENDAR_ID||'primary')+'</p></section>';}
    async function saveSettings(){try{state.settings=unwrap(await callServer('adminSaveSettings',{BARBER_NAME:document.getElementById('set-name').value,BARBER_EMAIL:document.getElementById('set-email').value,CALENDAR_ID:document.getElementById('set-calendar').value,PUBLIC_APP_URL:document.getElementById('set-public-url').value,MAX_ACTIVE_APPOINTMENTS_PER_CLIENT:document.getElementById('set-max').value,BOOKING_ADVANCE_DAYS:document.getElementById('set-days').value,MIN_BOOKING_ADVANCE_MINUTES:document.getElementById('set-minutes').value,OTP_EXPIRATION_MINUTES:document.getElementById('set-otp').value,SLOT_INTERVAL_MINUTES:document.getElementById('set-slot').value,REQUIRE_EMAIL_VERIFICATION:document.getElementById('set-verify').value,BUSINESS_TIMEZONE:document.getElementById('set-timezone').value}));document.getElementById('settings-message').innerHTML=successBox('Configurações salvas.');}catch(e){document.getElementById('settings-message').innerHTML=errorBox(e.message);}}
    async function refreshCurrent(){await boot(true);}
    async function boot(refresh){try{state.bootstrap=unwrap(await callServer('adminGetBootstrap'));if(!state.bootstrap.configured){setHeader('Configuração inicial','Finalize a fundação antes de usar o painel.');document.getElementById('app').innerHTML='<section class="card setup stack"><h2>Base ainda não configurada</h2><p>O primeiro passo cria a planilha, as abas, as configurações padrão e vincula o administrador atual.</p><div id="setup-message"></div><button class="primary" onclick="initializeSystem()">Inicializar sistema</button><p class="muted">Se a conta ainda não tiver autorizado Sheets, Calendar e MailApp, o Google solicitará a autorização ao executar esta etapa.</p></section>';return;}state.settings=state.bootstrap.settings;state.schedule=state.bootstrap.schedule;showTab(state.tab);}catch(e){document.getElementById('app').innerHTML=errorBox(e.message);}}
    async function initializeSystem(){try{const result=unwrap(await callServer('adminInitializeSystem'));document.getElementById('setup-message').innerHTML=successBox('Sistema inicializado. Spreadsheet: '+result.spreadsheetId);await boot(true);}catch(e){document.getElementById('setup-message').innerHTML=errorBox(e.message);}}
    boot();
  </script>
</body>
</html>
