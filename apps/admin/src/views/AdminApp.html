<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel administrativo</title>
  <style>
    :root {
      --background: #f7f7f5;
      --surface: #ffffff;
      --surface-subtle: #f1f1ef;
      --surface-hover: #fafaf9;
      --foreground: #1c1917;
      --muted: #756f6b;
      --muted-strong: #57534e;
      --border: #e7e5e4;
      --border-strong: #d6d3d1;
      --sidebar: #222625;
      --sidebar-hover: #2d3432;
      --sidebar-muted: #a8b0ad;
      --sidebar-foreground: #f8faf9;
      --primary: #222625;
      --primary-hover: #151918;
      --primary-foreground: #ffffff;
      --accent: #b65335;
      --accent-strong: #963e29;
      --accent-soft: #fff1eb;
      --success: #167253;
      --success-soft: #eaf7f0;
      --warning: #a16207;
      --warning-soft: #fff8e7;
      --danger: #b42318;
      --danger-soft: #fff0ef;
      --info: #315f8a;
      --info-soft: #edf5fb;
      --ring: rgba(182, 83, 53, .25);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 2px rgba(28, 25, 23, .04), 0 4px 12px rgba(28, 25, 23, .04);
      --shadow-md: 0 12px 28px rgba(28, 25, 23, .08), 0 2px 6px rgba(28, 25, 23, .04);
      --ease: cubic-bezier(.2, .75, .25, 1);
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--background); }
    body { margin: 0; color: var(--foreground); background: var(--background); font-family: "Avenir Next", "Trebuchet MS", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; line-height: 1.45; font-feature-settings: "cv02", "cv03", "cv04", "cv11"; -webkit-font-smoothing: antialiased; }
    body.modal-open { overflow: hidden; }
    button, input, select, textarea { font: inherit; }
    button { border: 0; cursor: pointer; }
    button:disabled { opacity: .52; cursor: not-allowed; }
    a { color: inherit; }
    svg { display: block; flex: 0 0 auto; }
    ::selection { color: var(--primary-foreground); background: var(--accent); }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: var(--surface-subtle); }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border: 3px solid var(--surface-subtle); border-radius: 999px; }
    :focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }
    .admin-shell { min-height: 100vh; display: grid; grid-template-columns: 248px minmax(0, 1fr); }
    .sidebar { position: sticky; top: 0; z-index: 30; height: 100vh; display: flex; flex-direction: column; padding: 18px 12px 14px; color: var(--sidebar-foreground); background: var(--sidebar); }
    .sidebar-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 2px 8px 20px; }
    .brand-lockup { display: inline-flex; align-items: center; gap: 10px; min-width: 0; padding: 0; border: 0; color: inherit; background: transparent; text-align: left; }
    .brand-mark { width: 31px; height: 31px; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.16); border-radius: 9px; color: #fff; background: rgba(255,255,255,.08); font-size: 14px; font-weight: 800; letter-spacing: -.04em; }
    .brand-copy { display: grid; gap: 0; line-height: 1.1; }
    .brand-copy strong { max-width: 155px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; letter-spacing: -.01em; }
    .brand-copy span { color: var(--sidebar-muted); font-size: 10px; margin-top: 3px; }
    .sidebar-close { display: none; width: 32px; height: 32px; place-items: center; border-radius: 8px; color: var(--sidebar-muted); background: transparent; }
    .workspace-switcher { display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid rgba(255,255,255,.10); border-radius: var(--radius-md); background: rgba(255,255,255,.045); }
    .workspace-avatar, .avatar { display: grid; place-items: center; flex: 0 0 auto; width: 32px; height: 32px; border-radius: 9px; background: #d7a18f; color: #3c1f17; font-size: 11px; font-weight: 800; }
    .workspace-copy { display: grid; min-width: 0; gap: 2px; }
    .workspace-copy strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
    .workspace-copy span { color: var(--sidebar-muted); font-size: 10px; }
    .nav { display: grid; gap: 2px; margin-top: 25px; overflow-y: auto; }
    .nav-label { padding: 0 10px 7px; color: #77827e; font-size: 10px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    .nav-label + .nav-label { margin-top: 17px; }
    .nav-item { min-height: 38px; display: flex; align-items: center; gap: 10px; width: 100%; padding: 0 10px; border-radius: var(--radius-sm); color: #c5ceca; background: transparent; font-size: 12px; font-weight: 620; text-align: left; transition: background .18s var(--ease), color .18s var(--ease); }
    .nav-item svg { color: #95a19c; }
    .nav-item:hover { color: #fff; background: var(--sidebar-hover); }
    .nav-item.active { color: #fff; background: #343c39; box-shadow: inset 2px 0 0 var(--accent); }
    .nav-item.active svg { color: #e0a18d; }
    .sidebar-footer { display: grid; gap: 7px; margin-top: auto; padding: 15px 8px 0; border-top: 1px solid rgba(255,255,255,.09); }
    .sidebar-link { display: inline-flex; align-items: center; gap: 7px; color: var(--sidebar-muted); font-size: 11px; text-decoration: none; }
    .sidebar-link:hover { color: #fff; }
    .sidebar-link.disabled { opacity: .55; pointer-events: none; }
    .sidebar-note { color: #77827e; font-size: 10px; line-height: 1.45; }
    .sidebar-backdrop { display: none; }
    .main-shell { min-width: 0; }
    .topbar { min-height: 74px; display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 0 clamp(20px, 4vw, 54px); border-bottom: 1px solid var(--border); background: rgba(247,247,245,.92); }
    .topbar-leading { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .menu-toggle { display: none; width: 38px; height: 38px; place-items: center; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--foreground); }
    .topbar-copy { min-width: 0; }
    .topbar-copy h1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 18px; line-height: 1.1; letter-spacing: -.035em; font-weight: 760; }
    .topbar-copy p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 4px; color: var(--muted); font-size: 11px; }
    .topbar-actions { display: flex; align-items: center; gap: 8px; }
    .topbar-status { display: inline-flex; align-items: center; gap: 6px; margin-right: 5px; color: var(--muted); font-size: 11px; }
    .topbar-status::before { width: 6px; height: 6px; content: ""; border-radius: 99px; background: var(--success); }
    .topbar-user { display: inline-flex; align-items: center; gap: 8px; padding-left: 8px; border-left: 1px solid var(--border); }
    .topbar-user .avatar { width: 30px; height: 30px; }
    .topbar-user span { display: grid; gap: 1px; }
    .topbar-user strong { font-size: 11px; }
    .topbar-user small { color: var(--muted); font-size: 10px; }
    .content { width: min(100%, 1500px); margin: 0 auto; padding: 30px clamp(20px, 4vw, 54px) 56px; }
    .view { animation: view-in .35s var(--ease) both; }
    @keyframes view-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .view-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    .view-heading h2 { margin: 0; font-size: 24px; letter-spacing: -.05em; line-height: 1.05; }
    .view-heading p { margin-top: 6px; color: var(--muted); font-size: 13px; }
    .view-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
    .button { min-height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 13px; border: 1px solid transparent; border-radius: var(--radius-sm); font-size: 12px; font-weight: 650; letter-spacing: -.01em; transition: background .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease), transform .18s var(--ease), box-shadow .18s var(--ease); }
    .button:hover:not(:disabled) { transform: translateY(-1px); }
    .button:active:not(:disabled) { transform: translateY(0); }
    .button.primary { color: var(--primary-foreground); background: var(--primary); box-shadow: 0 1px 2px rgba(28,25,23,.15); }
    .button.primary:hover:not(:disabled) { background: var(--primary-hover); box-shadow: var(--shadow-sm); }
    .button.secondary { color: var(--foreground); border-color: var(--border-strong); background: var(--surface); }
    .button.secondary:hover:not(:disabled) { background: var(--surface-subtle); border-color: #a8a29e; }
    .button.ghost { color: var(--muted-strong); background: transparent; }
    .button.ghost:hover:not(:disabled) { color: var(--foreground); background: var(--surface-subtle); }
    .button.danger { color: var(--danger); border-color: #f7c9c5; background: var(--danger-soft); }
    .button.danger:hover:not(:disabled) { background: #ffe4e1; }
    .button.small { min-height: 34px; padding: 0 10px; font-size: 11px; }
    .button.icon-button { width: 36px; padding: 0; }
    .button.full { width: 100%; }
    .button:disabled { opacity: .5; cursor: not-allowed; }
    .filter-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .filter-bar label { min-width: 128px; }
    .filter-tabs { display: inline-flex; padding: 3px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface-subtle); }
    .filter-tab { min-height: 30px; padding: 0 10px; border-radius: 6px; color: var(--muted); background: transparent; font-size: 11px; font-weight: 650; }
    .filter-tab:hover { color: var(--foreground); }
    .filter-tab.active { color: var(--foreground); background: var(--surface); box-shadow: 0 1px 2px rgba(28,25,23,.08); }
    .card { border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-sm); }
    .card-body { padding: 18px; }
    .metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .metric-card { min-height: 124px; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-sm); }
    .metric-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--muted); }
    .metric-icon { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; color: var(--accent-strong); background: var(--accent-soft); }
    .metric-label { font-size: 11px; font-weight: 650; }
    .metric-value { margin-top: 12px; font-size: 25px; line-height: 1; letter-spacing: -.06em; font-weight: 760; font-variant-numeric: tabular-nums; }
    .metric-helper { margin-top: 8px; color: var(--muted); font-size: 10px; }
    .metric-card.success .metric-icon { color: var(--success); background: var(--success-soft); }
    .metric-card.warning .metric-icon { color: var(--warning); background: var(--warning-soft); }
    .metric-card.danger .metric-icon { color: var(--danger); background: var(--danger-soft); }
    .metric-card.info .metric-icon { color: var(--info); background: var(--info-soft); }
    .insight-strip { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .insight { display: inline-flex; align-items: center; gap: 7px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; color: var(--muted-strong); background: var(--surface); font-size: 11px; }
    .insight strong { color: var(--foreground); font-variant-numeric: tabular-nums; }
    .panel-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(300px, .85fr); gap: 12px; margin-top: 12px; }
    .panel { overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-sm); }
    .panel-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 17px 18px 0; }
    .panel-header h3 { margin: 0; font-size: 14px; letter-spacing: -.02em; }
    .panel-header p { margin-top: 4px; color: var(--muted); font-size: 11px; }
    .panel-header .panel-meta { color: var(--muted); font-size: 11px; }
    .panel-body { padding: 18px; }
    .chart-wrap { min-height: 260px; padding: 12px 14px 13px; }
    .chart { width: 100%; height: 228px; overflow: visible; }
    .chart-grid { stroke: var(--border); stroke-width: 1; }
    .chart-line { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .chart-area { fill: rgba(182, 83, 53, .08); }
    .chart-dot { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
    .chart-label { fill: var(--muted); font-size: 10px; font-family: inherit; }
    .rank-list { display: grid; gap: 0; }
    .rank-row { display: grid; grid-template-columns: 28px minmax(0,1fr) auto; align-items: center; gap: 9px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .rank-row:last-child { border-bottom: 0; }
    .rank-number { color: var(--muted); font-size: 11px; font-weight: 750; font-variant-numeric: tabular-nums; }
    .rank-copy { display: grid; gap: 4px; min-width: 0; }
    .rank-copy strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
    .rank-track { height: 5px; overflow: hidden; border-radius: 999px; background: var(--surface-subtle); }
    .rank-track span { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
    .rank-value { text-align: right; font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .appointment-list { display: grid; gap: 0; }
    .appointment-row { display: grid; grid-template-columns: 74px minmax(180px, 1.2fr) minmax(140px, 1fr) 108px minmax(170px, .9fr); align-items: center; gap: 12px; padding: 13px 18px; border-top: 1px solid var(--border); }
    .appointment-row:first-child { border-top: 0; }
    .appointment-time { display: grid; gap: 2px; }
    .appointment-time strong { font-size: 13px; font-variant-numeric: tabular-nums; }
    .appointment-time span { color: var(--muted); font-size: 10px; }
    .appointment-person, .appointment-service { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .appointment-person .avatar { width: 30px; height: 30px; border-radius: 8px; }
    .appointment-copy { display: grid; gap: 2px; min-width: 0; }
    .appointment-copy strong, .appointment-copy span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .appointment-copy strong { font-size: 12px; }
    .appointment-copy span { color: var(--muted); font-size: 10px; }
    .appointment-service { display: grid; gap: 2px; }
    .appointment-service strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
    .appointment-service span { color: var(--muted); font-size: 10px; }
    .appointment-actions { display: flex; justify-content: flex-end; gap: 5px; flex-wrap: wrap; }
    .status-badge { display: inline-flex; align-items: center; gap: 6px; width: fit-content; min-height: 24px; padding: 0 8px; border: 1px solid var(--border); border-radius: 999px; color: var(--muted-strong); background: var(--surface-subtle); font-size: 10px; font-weight: 720; white-space: nowrap; }
    .status-badge::before { width: 6px; height: 6px; content: ""; border-radius: 99px; background: currentColor; }
    .status-badge.success { color: var(--success); border-color: #b7e4c9; background: var(--success-soft); }
    .status-badge.warning { color: var(--warning); border-color: #f4d699; background: var(--warning-soft); }
    .status-badge.danger { color: var(--danger); border-color: #f7c9c5; background: var(--danger-soft); }
    .status-badge.info { color: var(--info); border-color: #c7dff2; background: var(--info-soft); }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 14px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; }
    th { color: var(--muted); font-size: 10px; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; }
    td { font-size: 12px; }
    tr:last-child td { border-bottom: 0; }
    td strong { font-size: 12px; }
    td .sub { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }
    .empty-state { display: grid; justify-items: start; gap: 8px; padding: 30px 20px; border: 1px dashed var(--border-strong); border-radius: var(--radius-md); color: var(--muted); background: var(--surface-subtle); }
    .empty-state .empty-icon { color: var(--accent); }
    .empty-state strong { color: var(--foreground); font-size: 14px; }
    .empty-state p { max-width: 52ch; font-size: 12px; }
    .alert { display: flex; align-items: flex-start; gap: 9px; padding: 12px 13px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 12px; }
    .alert.info { color: var(--info); border-color: #c7dff2; background: var(--info-soft); }
    .alert.error { color: var(--danger); border-color: #f7c9c5; background: var(--danger-soft); }
    .alert.success { color: var(--success); border-color: #b7e4c9; background: var(--success-soft); }
    .alert.warning { color: var(--warning); border-color: #f4d699; background: var(--warning-soft); }
    .toolbar { display: flex; align-items: end; gap: 9px; flex-wrap: wrap; padding: 14px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-sm); }
    .field { display: grid; gap: 6px; min-width: 150px; }
    .field.grow { flex: 1; min-width: 220px; }
    .field-label { color: var(--muted-strong); font-size: 11px; font-weight: 700; }
    input, select, textarea { width: 100%; min-height: 40px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface); color: var(--foreground); padding: 0 11px; outline: 0; transition: border-color .18s var(--ease), box-shadow .18s var(--ease), background .18s var(--ease); }
    textarea { min-height: 92px; padding-top: 10px; resize: vertical; }
    input::placeholder, textarea::placeholder { color: #a8a29e; }
    input:hover, select:hover, textarea:hover { border-color: #a8a29e; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
    input[type="date"], input[type="time"] { color-scheme: light; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .form-grid .full { grid-column: 1 / -1; }
    .form-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .switch-field { display: flex; align-items: center; gap: 9px; min-height: 40px; }
    .switch { position: relative; display: inline-flex; width: 36px; height: 20px; flex: 0 0 auto; }
    .switch input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .switch-track { width: 36px; height: 20px; padding: 2px; border-radius: 99px; background: var(--border-strong); transition: background .18s var(--ease); }
    .switch-track::after { display: block; width: 16px; height: 16px; content: ""; border-radius: 99px; background: #fff; box-shadow: 0 1px 2px rgba(28,25,23,.18); transition: transform .18s var(--ease); }
    .switch input:checked + .switch-track { background: var(--success); }
    .switch input:checked + .switch-track::after { transform: translateX(16px); }
    .switch-copy { display: grid; gap: 2px; }
    .switch-copy strong { font-size: 12px; }
    .switch-copy span { color: var(--muted); font-size: 10px; }
    .service-layout { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: 12px; align-items: start; }
    .service-form { position: sticky; top: 18px; }
    .form-title { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .form-title h3 { margin: 0; font-size: 15px; }
    .form-title p { color: var(--muted); font-size: 11px; margin-top: 4px; }
    .service-cards { display: grid; gap: 9px; }
    .service-card { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 15px 16px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-sm); }
    .service-card:hover { border-color: var(--border-strong); }
    .service-card-copy { display: grid; gap: 3px; min-width: 0; }
    .service-card-copy strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .service-card-copy span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 11px; }
    .service-card-meta { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
    .service-card-meta strong { font-size: 13px; font-variant-numeric: tabular-nums; }
    .service-card-meta small { color: var(--muted); font-size: 10px; }
    .schedule-grid { display: grid; gap: 0; }
    .schedule-row { display: grid; grid-template-columns: 110px 70px minmax(100px, 1fr) minmax(100px, 1fr) 68px; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .schedule-row:last-child { border-bottom: 0; }
    .schedule-day { font-size: 12px; font-weight: 680; }
    .schedule-state { color: var(--muted); font-size: 11px; }
    .schedule-row input:disabled { color: #a8a29e; background: var(--surface-subtle); }
    .rule-list { display: grid; gap: 0; margin-top: 14px; border-top: 1px solid var(--border); }
    .rule-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--border); }
    .rule-copy { display: grid; gap: 2px; min-width: 0; }
    .rule-copy strong { font-size: 11px; }
    .rule-copy span { color: var(--muted); font-size: 10px; }
    .stat-list { display: grid; gap: 0; }
    .stat-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .stat-row:last-child { border-bottom: 0; }

    function availabilityHtml() { const s=state.schedule||{workSchedule:[],overrides:[],blocks:[]};return '<section class="panel"><div class="panel-header"><div><h3>Horário padrão</h3><p>A rotina semanal que vale quando não há exceções.</p></div><button class="button primary small" type="button" onclick="saveSchedule()">Salvar rotina</button></div><div class="panel-body"><div class="schedule-grid">'+(s.workSchedule||[]).map(function(row){return '<div class="schedule-row"><span class="schedule-day">'+dayNames[row.weekday]+'</span><label class="switch"><input class="schedule-enabled" data-weekday="'+row.weekday+'" type="checkbox" '+(row.enabled?'checked':'')+'><span class="switch-track"></span></label><input class="schedule-start" data-weekday="'+row.weekday+'" type="time" value="'+esc(row.startTime||'')+'" '+(row.enabled?'':'disabled')+' aria-label="Início '+dayNames[row.weekday]+'"><input class="schedule-end" data-weekday="'+row.weekday+'" type="time" value="'+esc(row.endTime||'')+'" '+(row.enabled?'':'disabled')+' aria-label="Fim '+dayNames[row.weekday]+'"><span class="schedule-state">'+(row.enabled?'Aberto':'Fechado')+'</span></div>';}).join('')+'</div></div></section><div class="panel-grid"><section class="panel"><div class="panel-header"><div><h3>Exceções de data</h3><p>Feche ou altere apenas um dia.</p></div></div><div class="panel-body"><div class="form-grid"><label class="field"><span class="field-label">Data</span><input id="override-date" type="date"></label><label class="switch-field"><span class="switch"><input id="override-enabled" type="checkbox" checked><span class="switch-track"></span></span><span class="switch-copy"><strong>Aberto nesse dia</strong><span>Desative para fechar a data.</span></span></label><label class="field"><span class="field-label">Início</span><input id="override-start" type="time" value="09:00"></label><label class="field"><span class="field-label">Fim</span><input id="override-end" type="time" value="19:00"></label></div><button class="button secondary small" style="margin-top:14px" type="button" onclick="saveOverride()">Adicionar exceção</button><div class="rule-list">'+((s.overrides||[]).length?(s.overrides||[]).map(function(item){return '<div class="rule-row"><span class="rule-copy"><strong>'+esc(formatDate(item.date))+' · '+(item.enabled?esc(item.startTime)+'–'+esc(item.endTime):'Fechado')+'</strong><span>Exceção prioritária</span></span><button class="button ghost small icon-button" type="button" aria-label="Excluir exceção" onclick="deleteOverride(\''+esc(item.id)+'\')">'+icon('trash',14)+'</button></div>';}).join(''):'<div class="empty-state" style="margin-top:14px"><strong>Nenhuma exceção cadastrada.</strong><p>Use quando uma data fugir da rotina.</p></div>')+'</div></div></section><section class="panel"><div class="panel-header"><div><h3>Bloqueios</h3><p>Reserve intervalos para compromissos pessoais.</p></div></div><div class="panel-body"><div class="form-grid"><label class="field"><span class="field-label">Data</span><input id="block-date" type="date"></label><label class="field"><span class="field-label">Motivo</span><input id="block-reason" maxlength="200" placeholder="Ex.: compromisso pessoal"></label><label class="field"><span class="field-label">Início</span><input id="block-start" type="time" value="12:00"></label><label class="field"><span class="field-label">Fim</span><input id="block-end" type="time" value="14:00"></label></div><button class="button secondary small" style="margin-top:14px" type="button" onclick="saveBlock()">Adicionar bloqueio</button><div class="rule-list">'+((s.blocks||[]).length?(s.blocks||[]).map(function(item){return '<div class="rule-row"><span class="rule-copy"><strong>'+esc(formatDate(item.date))+' · '+esc(item.startTime)+'–'+esc(item.endTime)+'</strong><span>'+esc(item.reason||'Sem motivo informado')+'</span></span><button class="button ghost small icon-button" type="button" aria-label="Excluir bloqueio" onclick="deleteBlock(\''+esc(item.id)+'\'     function wireScheduleSwitches() { document.querySelectorAll('.schedule-enabled').forEach(function(input){input.addEventListener('change',function(){const day=input.dataset.weekday;const start=document.querySelector('.schedule-start[data-weekday="'+day+'"]');const end=document.querySelector('.schedule-end[data-weekday="'+day+'"]');if(start)start.disabled=!input.checked;if(end)end.disabled=!input.checked;const status=input.closest('.schedule-row').querySelector('.schedule-state');if(status)status.textContent=input.checked?'Aberto':'Fechado';});}); }
    async function saveSchedule() { try{const rows=Array.from(document.querySelectorAll('.schedule-enabled')).map(function(input){const day=input.dataset.weekday;return {weekday:day,enabled:input.checked,startTime:document.querySelector('.schedule-start[data-weekday="'+day+'"]').value,endTime:document.querySelector('.schedule-end[data-weekday="'+day+'"]').value};});state.schedule=unwrap(await callServer('adminSaveWorkSchedule',{rows:rows}));document.getElementById('availability-content').innerHTML=availabilityHtml();wireScheduleSwitches();showToast('success','Rotina salva','A disponibilidade padrão foi atualizada.');}catch(error){showToast('error','Não foi possível salvar',error.message||'Verifique os horários.');} }

    async function saveBlock() { try{state.schedule=unwrap(await callServer('adminSaveBlock',{date:document.getElementById('block-date').value,startTime:document.getElementById('block-start').value,endTime:document.getElementById('block-end').value,reason:document.getElementById('block-reason').value}));document.getElementById('availability-content').innerHTML=availabilityHtml();wireScheduleSwitches();showToast('success','Bloqueio adicionado','O intervalo foi retirado dos horários públicos.');}catch(error){showToast('error','Não foi possível adicionar',error.message||'Verifique o intervalo.');} }
    async function deleteBlock(id) { openDialog('Excluir bloqueio?','O intervalo voltará a ficar disponível conforme sua rotina.','Excluir bloqueio','danger',function(){callServer('adminDeleteBlock',id).then(function(result){state.schedule=unwrap(result);closeDialog();document.getElementById('availability-content').innerHTML=availabilityHtml();wireScheduleSwitches();showToast('success','Bloqueio excluído','O intervalo foi liberado.');}).catch(function(error){closeDialog();showToast('error','Não foi possível excluir',error.message);});}); }

    function financeContent(data, agenda) {
      const c = data.cards || {};
      const paid = (agenda || []).filter(function(item) { return item.status === 'COMPLETED'; });
      const paymentMap = {};
      paid.forEach(function(item) { const key = item.paymentMethod || 'Não informado'; paymentMap[key] = (paymentMap[key] || 0) + Number(item.servicePrice || 0); });
      const paymentRows = Object.keys(paymentMap).length ? Object.keys(paymentMap).map(function(key) { return '<div class="stat-row"><span>' + esc(key) + '</span><strong>' + money(paymentMap[key]) + '</strong></div>'; }).join('') : '<div class="empty-state"><strong>Sem pagamentos no período.</strong><p>Ao concluir atendimentos, a receita por forma de pagamento aparecerá aqui.</p></div>';
      const serviceRows = (data.serviceStats || []).length ? (data.serviceStats || []).map(function(item) { return '<tr><td><strong>' + esc(item.serviceName) + '</strong></td><td>' + esc(item.quantity) + '</td><td><strong>' + money(item.revenue) + '</strong></td></tr>'; }).join('') : '<tr><td colspan="3"><div class="empty-state"><strong>Sem dados no período.</strong><p>Conclua um atendimento para gerar dados.</p></div></td></tr>';
      return '<div class="metric-grid">' + metricCard('Faturamento', money(c.revenue), 'Concluídos', 'wallet', 'success') + metricCard('Faturamento previsto', money(c.expectedRevenue), 'Agendamentos ativos', 'calendar', 'info') + metricCard('Ticket médio', money(c.averageTicket), 'Por atendimento concluído', 'dollar', '') + metricCard('Cancelamentos', c.cancellations || 0, 'No período', 'ban', 'danger') + '</div>' +
        '<div class="panel-grid"><section class="panel"><div class="panel-header"><div><h3>Receita ao longo do tempo</h3><p>Baseada no preço registrado no atendimento.</p></div></div>' + timelineChart(data.timeline) + '</section><section class="panel"><div class="panel-header"><div><h3>Formas de pagamento</h3><p>Atendimentos concluídos no período.</p></div></div><div class="panel-body stat-list">' + paymentRows + '</div></section></div>' +
        '<section class="panel" style="margin-top:12px"><div class="panel-header"><div><h3>Receita por serviço</h3><p>O preço histórico não muda quando o cadastro é alterado.</p></div></div><div class="table-wrap"><table><thead><tr><th>Serviço</th><th>Atendimentos</th><th>Receita</th></tr></thead><tbody>' + serviceRows + '</tbody></table></div></section>';
    }

    function settingsHtml() { const s=state.settings||{};return '<div class="panel"><div class="panel-header"><div><h3>Operação</h3><p>Esses valores controlam o fluxo de agendamento.</p></div><span class="status-badge success">Sheets é a fonte oficial</span></div><div class="panel-body"><div class="form-grid"><label class="field"><span class="field-label">Nome da barbearia</span><input id="set-name" value="'+esc(s.BARBER_NAME||'')+'"></label><label class="field"><span class="field-label">E-mail do barbeiro</span><input id="set-email" type="email" value="'+esc(s.BARBER_EMAIL||'')+'"></label><label class="field"><span class="field-label">Calendar ID</span><input id="set-calendar" value="'+esc(s.CALENDAR_ID||'primary')+'"></label><label class="field"><span class="field-label">URL do Public Web App</span><input id="set-public-url" placeholder="https://script.google.com/..." value="'+esc(s.PUBLIC_APP_URL||'')+'"></label><label class="field"><span class="field-label">Máx. de agendamentos por cliente</span><input id="set-max" type="number" min="1" value="'+esc(s.MAX_ACTIVE_APPOINTMENTS_PER_CLIENT||2)+'"></label><label class="field"><span class="field-label">Dias de antecedência</span><input id="set-days" type="number" min="1" value="'+esc(s.BOOKING_ADVANCE_DAYS||60)+'"></label><label class="field"><span class="field-label">Antecedência mínima (min)</span><input id="set-minutes" type="number" min="1" value="'+esc(s.MIN_BOOKING_ADVANCE_MINUTES||30)+'"></label><label class="field"><span class="field-label">Expiração OTP (min)</span><input id="set-otp" type="number" min="1" value="'+esc(s.OTP_EXPIRATION_MINUTES||10)+'"></label><label class="field"><span class="field-label">Intervalo dos horários (min)</span><input id="set-slot" type="number" min="5" value="'+esc(s.SLOT_INTERVAL_MINUTES||30)+'"></label><label class="field"><span class="field-label">Exigir confirmação de e-mail</span><select id="set-verify"><option value="true" '+(s.REQUIRE_EMAIL_VERIFICATION?'selected':'')+'>Si     async function saveSettings() { const payload={BARBER_NAME:document.getElementById('set-name').value,BARBER_EMAIL:document.getElementById('set-email').value,CALENDAR_ID:document.getElementById('set-calendar').value,PUBLIC_APP_URL:document.getElementById('set-public-url').value,MAX_ACTIVE_APPOINTMENTS_PER_CLIENT:document.getElementById('set-max').value,BOOKING_ADVANCE_DAYS:document.getElementById('set-days').value,MIN_BOOKING_ADVANCE_MINUTES:document.getElementById('set-minutes').value,OTP_EXPIRATION_MINUTES:document.getElementById('set-otp').value,SLOT_INTERVAL_MINUTES:document.getElementById('set-slot').value,REQUIRE_EMAIL_VERIFICATION:document.getElementById('set-verify').value,BUSINESS_TIMEZONE:document.getElementById('set-timezone').value};try{state.settings=Object.assign({},state.settings,unwrap(await callServer('adminSaveSettings',payload)));document.getElementById('settings-message').innerHTML=alertBox('success','Configurações salvas.');hydrateBrand();showToast('success','Configurações salvas','O painel já está usando os novos valores.');}catch(error){document.getElementById('settings-message').innerHTML=alertBox('error',error.message||'Não foi possível salvar as configurações.');} }

    function hydrateBrand() { const settings=state.settings||state.bootstrap&&state.bootstrap.settings||{};const name=settings.BARBER_NAME||'Barbearia';document.getElementById('brand-name').textContent=name+' Admin';document.getElementById('workspace-name').textContent=name;document.getElementById('topbar-user-name').textContent=name;const initialsValue=initials(name);document.getElementById('workspace-avatar').textContent=initialsValue;document.getElementById('topbar-avatar').textContent=initialsValue;const link=document.getElementById('public-link');if(settings.PUBLIC_APP_URL){link.href=settings.PUBLIC_APP_URL;link.classList.remove('disabled');}else{link.href='#';link.classList.add('disabled');} }
    async function refreshCurrent() { if(state.tab==='dashboard')return loadDashboard();if(state.tab==='agenda')return loadAgendaData('agenda');if(state.tab==='appointments')return loadAgendaData('appointments');if(state.tab==='clients')return loadClients();if(state.tab==='services')return loadServices();if(state.tab==='availability')return loadSchedule();if(state.tab==='finance')return loadFinance();if(state.tab==='settings')return loadSettings(); }
    async function boot() { applyNavIcons();try{state.bootstrap=unwrap(await callServer('adminGetBootstrap'));state.settings=state.bootstrap.settings;hydrateBrand();if(!state.bootstrap.configured){setHeader('Configuração inicial','Finalize a fundação antes de usar o painel.');document.getElementById('app').innerHTML='<div class="setup"><section class="card"><div class="card-body"><span class="setup-mark">'+icon('settings',22)+'</span><h2>Base ainda não configurada.</h2><p>O primeiro passo cria a planilha, as abas, as configurações padrão e vincula o administrador atual.</p><div id="setup-message"></div><button class="button primary" type="button" onclick="initializeSystem()">Inicializar sistema '+icon('arrow-right',14)+'</button><p class="muted">Se a conta ainda não tiver autorizado Sheets, Calendar e MailApp, o Google solicitará autorização ao executar esta etapa.</p></div></section></div>';return;}showTab('dashboard');}catch(error){document.getElementById('app').innerHTML=alertBox('error',error.message||'Não foi possível carregar o painel.','Falha ao carregar:');} }
    async function initializeSystem() { try{const result=unwrap(await callServer('adminInitializeSystem'));document.getElementById('setup-message').innerHTML=alertBox('success','Sistema inicializado. Spreadsheet: '+result.spreadsheetId);await boot();}catch(error){document.getElementById('setup-message').innerHTML=alertBox('error',error.message||'Não foi possível inicializar o sistema.');} }
    const originalRenderTab=renderTab;renderTab=function(){originalRenderTab();if(state.tab==='dashboard')loadDashboard();else if(state.tab==='agenda')loadAgendaData('agenda');else if(state.tab==='appointments')loadAgendaData('appointments');else if(state.tab==='clients')loadClients();else if(state.tab==='services')loadServices();else if(state.tab==='availability')loadSchedule();else if(state.tab==='finance')loadFinance();else if(state.tab==='settings')loadSettings();};
    boot();
  </script>
</body>
</html>
