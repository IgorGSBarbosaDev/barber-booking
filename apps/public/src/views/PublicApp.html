<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agendamento</title>
  <style>
    :root {
      --background: #f7f7f5;
      --surface: #ffffff;

      --surface-warm: #fffaf7;
      --foreground: #1c1917;

    button { border: 0; cursor: pointer; }

    a { color: inherit; }

    .public-shell { width: min(100%, 1080px); margin: 0 auto; padding: 0 14px 28px; }

    .brand-copy { display: grid; gap: 0; line-height: 1.1; }
    .brand-copy strong { max-width: 230px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; letter-spacing: -.01em; }
    .brand-copy span { color: var(--muted); font-size: 11px; margin-top: 3px; }

    body.booking-active .header-actions { padding-top: 1px; }

    .button:hover:not(:disabled) { transform: translateY(-1px); }

    .button.primary:hover:not(:disabled) { background: var(--primary-hover); box-shadow: var(--shadow-sm); }

    .button.secondary:hover:not(:disabled) { background: var(--surface-subtle); border-color: #a8a29e; }

    .button.ghost:hover:not(:disabled) { color: var(--foreground); background: var(--surface-subtle); }

    .service-meta span { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 12px; }

    .service-card .button { margin-top: 12px; width: 100%; }
    .booking-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-items: start; margin-top: 20px; }
    .panel { border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-sm); }
    .panel-body { padding: 17px; }
    .panel-heading { display: flex; align-items: flex-start; flex-direction: column; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    .panel-heading p { color: var(--muted); font-size: 13px; margin-top: 6px; }
    .selected-service { display: inline-flex; align-items: center; gap: 8px; padding: 7px 9px; border: 1px solid var(--border); border-radius: 8px; color: var(--muted-strong); background: var(--surface-subtle); font-size: 11px; white-space: nowrap; }
    .selected-service b { color: var(--foreground); }
    .field { display: grid; gap: 7px; }
    .field-label { color: var(--muted-strong); font-size: 12px; font-weight: 700; }
    input, select, textarea { width: 100%; min-height: 44px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface); color: var(--foreground); padding: 0 12px; outline: 0; transition: border-color .18s var(--ease), box-shadow .18s var(--ease), background .18s var(--ease); }
    textarea { min-height: 96px; padding-top: 10px; resize: vertical; }
    input::placeholder, textarea::placeholder { color: #a8a29e; }
    input:hover, select:hover, textarea:hover { border-color: #a8a29e; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
    .date-picker { position: relative; }
    .date-picker-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; }
    .date-control { width: 100%; min-width: 0; min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface); color: var(--foreground); text-align: left; font-variant-numeric: tabular-nums; }
    .date-control:hover { border-color: #a8a29e; }

    .selected-date-short { display: none; }
    .calendar-popover { position: absolute; z-index: 10; top: calc(100% + 8px); left: 0; width: min(100%, 360px); display: grid; gap: 12px; padding: 14px; border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-md); }
    .calendar-popover[hidden] { display: none; }
    .calendar-toolbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; }
    .calendar-month { font-size: 14px; font-weight: 720; text-transform: capitalize; }

    .calendar-weekdays, .calendar-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }

    .calendar-day, .calendar-empty { min-width: 0; min-height: 40px; display: grid; place-items: center; border-radius: 7px; }

    .time-slot { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface); color: var(--foreground); font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums; transition: border-color .18s var(--ease), background .18s var(--ease), color .18s var(--ease), transform .18s var(--ease); }
    .time-slot:hover { border-color: var(--primary); transform: translateY(-1px); }

    .customer-form { margin-top: 18px; }

    .field-hint { color: var(--muted); font-size: 11px; }
    .otp-field { margin-top: 14px; }
    .otp-input { letter-spacing: .35em; font-variant-numeric: tabular-nums; }
    .confirmation { max-width: 720px; margin: 18px auto 0; text-align: center; }
    .success-mark { width: 58px; height: 58px; display: grid; place-items: center; margin: 0 auto 20px; border: 1px solid #b7e4c9; border-radius: 18px; background: var(--success-soft); color: var(--success); animation: mark-in .6s var(--ease) both; }
    @keyframes mark-in { from { opacity: 0; transform: scale(.86) rotate(-7deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
    .confirmation h1 { max-width: 12ch; margin: 0 auto; }
    .confirmation > p { max-width: 45ch; margin: 13px auto 0; color: var(--muted); }

    .status-badge { display: inline-flex; align-items: center; gap: 6px; min-height: 24px; padding: 0 8px; border: 1px solid var(--border); border-radius: 999px; color: var(--muted-strong); background: var(--surface-subtle); font-size: 11px; font-weight: 720; }

    .alert.success { color: var(--success); border-color: #b7e4c9; background: var(--success-soft); }
    .alert.warning { color: var(--warning); border-color: #f4d699; background: var(--warning-soft); }

    .skeleton-slot-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .skeleton-slot { height: 44px; }

    .toast-copy strong { font-size: 12px; }
    .toast-copy span { color: var(--muted); font-size: 12px; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    function bookingCalendar() { const selected=state.date||todayIso();const monthKey=state.calendarMonth||selected.slice(0,7);const monthDate=parseIsoDate(monthKey+'-01');const year=monthDate.getFullYear();const month=monthDate.getMonth();const firstWeekday=new Date(year,month,1).getDay();const dayCount=new Date(year,month+1,0).getDate();const cellCount=Math.ceil((firstWeekday+dayCount)/7)*7;const minDate=todayIso();const maxDate=bookingMaxDate();const canGoBack=monthKey>minDate.slice(0,7);const canGoForward=monthKey<maxDate.slice(0,7);let days='';for(let index=0;index<cellCount;index+=1){const day=index-firstWeekday+1;if(day<1||day>dayCount){days+='<span class="calendar-empty" aria-hidden="true"></span>';continue;}const date=toIsoDate(new Date(year,month,day));const unavailable=date<minDate||date>maxDate;days+='<button class="calendar-day'+(date===minDate?' today':'')+(date===selected?' selected':'')+'" type="button" aria-label="'+escapeHtml(formatLongDate(date))+'" aria-pressed="'+(date===selected)+'" '+(unavailable?'disabled':'')+' onclick="setBookingDate(\''+date+'\')">'+day+'</button>';}

      }
    }
    function updateSelectedTimeSlots() {
      document.querySelectorAll('#availability .time-slot').forEach(function(button){const selected=!!state.slot&&button.dataset.startTime===state.slot.startTime;button.classList.toggle('selected',selected);button.setAttribute('aria-pressed',String(selected));});
    }
    function chooseSlot(startTime,endTime) {
      const firstSelection=!state.slot;state.slot={startTime:startTime,endTime:endTime};updateSelectedTimeSlots();
      if(firstSelection){updateBookingContinuation();window.setTimeout(function(){const field=document.getElementById('customer-name');if(field)field.focus();},40);}
    }
    function chooseAnotherSlot() {
      if(document.getElementById('customer-name'))state.customer=readCustomer();state.slot=null;updateSelectedTimeSlots();updateBookingContinuation();
      const target=document.querySelector('#availability .time-slot');if(target)target.focus();
    }
    function customerOtpField() { return '<label class=\"field full otp-field\"><span class=\"field-label\">Código de confirmação</span><input id=\"customer-otp\" class=\"otp-input\" inputmode=\"numeric\" maxlength=\"6\" placeholder=\"000000\" aria-describedby=\"otp-hint\"><span id=\"otp-hint\" class=\"field-hint\">Enviamos um código de 6 dígitos para o seu e-mail.</span></label>'; }
    function customerForm() {
      const customer=state.customer||{};const instruction=state.bootstrap.settings.REQUIRE_EMAIL_VERIFICATION&&!state.emailVerified?'Usaremos seu e-mail para enviar o código de confirmação.':'Usaremos seu e-mail para enviar a confirmação do agendamento.';
      return '<section class=\"panel customer-form\"><div class=\"panel-body\"><div class=\"panel-heading\"><div><h2>Seus dados</h2><p>'+instruction+'</p></div></div><div id=\"customer-fields\" class=\"form-grid\"><label class=\"field\"><span class=\"field-label\">Nome completo</span><input id=\"customer-name\" autocomplete=\"name\" required maxlength=\"120\" placeholder=\"Como podemos chamar você?\" value=\"'+escapeHtml(customer.name||'')+'\"></label><label class=\"field\"><span class=\"field-label\">Telefone</span><input id=\"customer-phone\" autocomplete=\"tel\" required inputmode=\"tel\" placeholder=\"(00) 00000-0000\" value=\"'+escapeHtml(customer.phone||'')+'\"></label><label class=\"field full\"><span class=\"field-label\">E-mail</span><input id=\"customer-email\" autocomplete=\"email\" required type=\"email\" placeholder=\"voce@email.com\" value=\"'+escapeHtml(customer.email||'')+'\"></label>'+(state.otpSent?customerOtpField():'')+'</div><div id=\"customer-message\" style=\"margin-top:14px\"></div><div class=\"form-actions\"><button id=\"customer-submit\" class=\"button primary\" type=\"button\" onclick=\"submitCustomer()\">'+(state.otpSent?'Validar e confirmar '+icon('check',15):'Confirmar agendamento '+icon('arrow-right',15))+'</button><button class=\"button ghost\" type=\"button\" onclick=\"chooseAnotherSlot()\">Escolher outro horário</button></div></div></section>';
    }
    function showOtpChallenge() {
      const fields=document.getElementById('customer-fields');if(fields&&!document.getElementById('customer-otp'))fields.insertAdjacentHTML('beforeend',customerOtpField());
      const submit=document.getElementById('customer-submit');if(submit)submit.innerHTML='Validar e confirmar '+icon('check',15);
      const message=document.getElementById('customer-message');if(message)message.innerHTML='';
    }
    function readCustomer() { return {name:document.getElementById('customer-name').value.trim(),phone:document.getElementById('customer-phone').value.trim(),email:document.getElementById('customer-email').value.trim(),clientId:state.clientId,browserToken:state.browserToken}; }
    function validateCustomer(customer) { if(!customer.name||customer.name.length<2)return 'Informe seu nome completo.';if(!customer.phone||customer.phone.replace(/\D/g,'').length<8)return 'Informe um telefone válido.';if(!/^\S+@\S+\.\S+$/.test(customer.email))return 'Informe um e-mail válido.';return ''; }
    async function submitCustomer() {
      const customer=readCustomer();state.customer=customer;const message=document.getElementById('customer-message');const validation=validateCustomer(customer);
      if(validation){message.innerHTML=alertBox('error',validation,'Confira os dados:');return;}
      message.innerHTML='<div class=\"alert info\" role=\"status\"><span class=\"spinner\"></span><span>Processando seu agendamento…</span></div>';
      try {
        if(state.bootstrap.settings.REQUIRE_EMAIL_VERIFICATION&&!state.emailVerified){
          if(!state.otpSent){const response=unwrap(await callServer('publicRequestOtp',customer));if(response.required){state.otpSent=true;showOtpChallenge();window.setTimeout(function(){const field=document.getElementById('customer-otp');if(field)field.focus();},40);return;}state.emailVerified=true;}
          else {const code=document.getElementById('customer-otp').value.trim();unwrap(await callServer('publicVerifyOtp',Object.assign({},customer,{code:code})));state.emailVerified=true;}
        }
        const result=unwrap(await callServer('publicCreateAppointment',Object.assign({},customer,{date:state.date,startTime:state.slot.startTime,endTime:state.slot.endTime,serviceId:state.service.id})));
        state.appointment=result.appointment;state.appointmentToken=result.managementToken;state.page='confirmation';render();showToast('success','Agendamento confirmado','Seu horário foi reservado com sucesso.');
      } catch(error) { message.innerHTML=alertBox('error',error.message||'Não foi possível concluir o agendamento.','Não foi possível confirmar:'); }
    }
    function ticket(appointment) { return '<section class="appointment-ticket"><div class="ticket-head"><div><strong>'+escapeHtml(appointment.serviceName)+'</strong><span>'+formatStatus(appointment.status)+'</span></div><span class="status-badge '+statusTone(appointment.status)+'">'+escapeHtml(formatStatus(appointment.status))+'</span></div><div class="ticket-lines"><div class="ticket-line"><span>Cliente</span><strong>'+escapeHtml(appointment.clientName||(state.customer&&state.customer.name)||'')+'</strong></div><div class="ticket-line"><span>Data</span><strong>'+escapeHtml(formatLongDate(appointment.date))+'</strong></div><div class="ticket-line"><span>Horário</span><strong>'+escapeHtml(appointment.startTime)+' – '+escapeHtml(appointment.endTime)+'</strong></div><div class="ticket-line"><span>Valor</span><strong>'+money(appointment.servicePrice)+'</strong></div></div></section>'; }
    function confirmationPage() { const appointment=state.appointment;if(!appointment)return homePage();const url=location.href.split('?')[0]+'?page=appointment&id='+encodeURIComponent(appointment.id)+'&token='+encodeURIComponent(state.appointmentToken);return '<div class="page confirmation"><span class="success-mark">'+icon('check',28)+'</span><h1>Agendamento confirmado.</h1><p>Seu horário está reservado. Guarde este link para consultar ou cancelar quando precisar.</p>'+ticket(appointment)+'<div class="ticket-actions"><a class="button secondary" href="'+url+'">'+icon('search',15)+' Consultar agendamento</a><button class="button primary" type="button" onclick="showPage(\'home\')">Novo agendamento '+icon('arrow-right',15)+'</button></div></div>'; }
    function appointmentPage() {
      if (state.legacyAppointmentLink) {
        return '<div class="page lookup"><section class="panel"><div class="panel-body"><div class="lookup-heading"><span class="eyebrow">Consulta</span><h1 style="font-size:clamp(1.9rem, 6vw, 2.6rem)">Seu agendamento.</h1><p>Este link seguro continua funcionando para o agendamento da confirmação.</p></div><div id="appointment-message" style="margin-top:14px"></div><button class="button secondary" type="button" onclick="useContactLookup()">Consultar outros agendamentos</button></div></section><div id="appointment-result" class="lookup-result"></div></div>';
      }
      return '<div class="page lookup"><section class="panel"><div class="panel-body"><div class="lookup-heading"><span class="eyebrow">Consulta</span><h1 style="font-size:clamp(1.9rem, 6vw, 2.6rem)">Encontre seus agendamentos.</h1><p>Informe o e-mail ou telefone usado no cadastro. O código de acesso será enviado ao e-mail associado.</p></div><label class="field"><span class="field-label">E-mail ou telefone</span><input id="appointment-lookup-identifier" type="text" autocomplete="off" placeholder="voce@email.com ou (31) 99999-0000"'+(state.lookupOtpSent?' disabled':'')+'></label><p class="lookup-contact-hint" style="margin-top:8px">Se o telefone estiver ligado a mais de um e-mail, informe o e-mail. Por segurança, só exibimos os agendamentos depois da confirmação do código.</p><div id="appointment-message" style="margin-top:14px"></div><div id="appointment-code-step" class="lookup-code-step'+(state.lookupOtpSent&&!state.lookupVerified?'':' hidden')+'"><label class="field"><span class="field-label">Código de 6 dígitos</span><input id="appointment-lookup-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"></label><p id="appointment-lookup-code-hint" class="lookup-contact-hint">Se os dados corresponderem a um cadastro, enviaremos o código ao e-mail associado.</p><div id="appointment-lookup-verify-message"></div><div class="lookup-code-actions"><button class="button primary" type="button" onclick="verifyAppointmentLookupCode()">Consultar agendamentos '+icon('search',15)+'</button><button class="button secondary" type="button" onclick="requestAppointmentLookupCode(true)">Reenviar código</button><button class="button ghost" type="button" onclick="resetAppointmentLookup()">Alterar contato</button></div></div></div></section><div id="appointment-lookup-results" class="lookup-result">'+appointmentLookupResultsHtml()+'</div></div>';
    }
    async function requestAppointmentLookupCode(resend) {
      const field=document.getElementById('appointment-lookup-identifier');
      const identifier=resend?state.lookupIdentifier:(field&&field.value||'').trim();
      const message=document.getElementById('appointment-message');
      if(!identifier){message.innerHTML=alertBox('error','Informe o e-mail ou telefone usado no cadastro.');return;}
      message.innerHTML='<div class="alert info" role="status"><span class="spinner"></span><span>Enviando o código…</span></div>';
      try {
        const response=unwrap(await callServer('publicRequestAppointmentLookupOtp',{identifier:identifier}));
        state.lookupIdentifier=identifier;
        state.lookupOtpSent=true;
        state.lookupVerified=false;
        state.lookupSessionToken='';
        state.lookupAppointments=[];
        if(field)field.disabled=true;
        const codeStep=document.getElementById('appointment-code-step');
        if(codeStep)codeStep.classList.remove('hidden');
        const hint=document.getElementById('appointment-lookup-code-hint');
        if(hint)hint.textContent=response.message||'Se os dados corresponderem a um cadastro, enviaremos o código ao e-mail associado.';
        const verifyMessage=document.getElementById('appointment-lookup-verify-message');
        if(verifyMessage)verifyMessage.innerHTML='';
        if(resend){const codeField=document.getElementById('appointment-lookup-code');if(codeField)codeField.value='';}
        message.innerHTML=alertBox('info','Se o cadastro corresponder aos dados informados, enviaremos um código ao e-mail associado. Confira também a caixa de spam.');
        renderAppointmentLookupResults();
      } catch(error) {
        message.innerHTML=alertBox('error',error.message||'Não foi possível solicitar o código.');
      }
    }
    async function verifyAppointmentLookupCode() {
      const codeField=document.getElementById('appointment-lookup-code');
      const code=(codeField&&codeField.value||'').trim();
      const message=document.getElementById('appointment-lookup-verify-message');
      if(!/^\d{6}$/.test(code)){message.innerHTML=alertBox('error','Informe o código de 6 dígitos recebido por e-mail.');return;}
      message.innerHTML='<div class="alert info" role="status"><span class="spinner"></span><span>Validando o código…</span></div>';
      try {
        const response=unwrap(await callServer('publicVerifyAppointmentLookup',{identifier:state.lookupIdentifier,code:code}));
        state.lookupVerified=true;
        state.lookupSessionToken=response.sessionToken;
        state.lookupAppointments=response.appointments||[];
        state.lookupNotice='';
        const codeStep=document.getElementById('appointment-code-step');
        if(codeStep)codeStep.classList.add('hidden');
        const requestMessage=document.getElementById('appointment-message');
        if(requestMessage)requestMessage.innerHTML='';
        renderAppointmentLookupResults();
      } catch(error) {
        message.innerHTML=alertBox('error',error.message||'O código é inválido ou expirou.');
      }
    }
    function resetAppointmentLookup() {
      state.lookupIdentifier='';state.lookupOtpSent=false;state.lookupVerified=false;state.lookupSessionToken='';state.lookupAppointments=[];state.lookupNotice='';
      const field=document.getElementById('appointment-lookup-identifier');if(field){field.value='';field.disabled=false;}
      const codeStep=document.getElementById('appointment-code-step');if(codeStep)codeStep.classList.add('hidden');
      const message=document.getElementById('appointment-message');if(message)message.innerHTML='';
      const results=document.getElementById('appointment-lookup-results');if(results)results.innerHTML='';
      if(field)field.focus();
    }
    function useContactLookup() { state.legacyAppointmentLink=false;state.appointment=null;state.appointmentToken='';state.page='appointment';render(); }
    function appointmentLookupResultsHtml() {
      if(!state.lookupVerified)return '';
      const notice=state.lookupNotice?alertBox(state.lookupNoticeType||'info',state.lookupNotice):'';
      if(!state.lookupAppointments.length)return notice+'<div class="empty-state"><span class="empty-icon">'+icon('calendar',22)+'</span><strong>Você não tem agendamentos ativos futuros.</strong><p>Quando precisar, consulte novamente com o mesmo e-mail ou telefone cadastrado.</p><button class="button secondary" type="button" onclick="resetAppointmentLookup()">Pesquisar outro contato</button></div>';
      const cards=state.lookupAppointments.map(function(appointment){
        const actions=appointment.canCancel
          ? '<button class="button danger" type="button" onclick="cancelListedAppointment(\''+escapeHtml(appointment.id)+'\')">Cancelar agendamento</button>'
          : '<p class="lookup-cancel-guidance">'+escapeHtml(appointment.cancellationMessage||'O cancelamento online não está disponível para este horário. Entre em contato diretamente com a barbearia para verificar as opções.')+'</p>';
        return '<article class="lookup-appointment-card">'+ticket(appointment)+'<div class="lookup-appointment-actions">'+actions+'</div></article>';
      }).join('');
      return notice+'<div class="lookup-results-heading"><h2>Agendamentos ativos</h2><p>Escolha um agendamento para consultar ou cancelar.</p></div><div class="lookup-booking-list">'+cards+'</div><div class="form-actions"><button class="button secondary" type="button" onclick="resetAppointmentLookup()">Consultar outro contato</button></div>';
    }
    function renderAppointmentLookupResults() { const results=document.getElementById('appointment-lookup-results');if(results)results.innerHTML=appointmentLookupResultsHtml(); }
    function cancelListedAppointment(appointmentId) {
      const appointment=state.lookupAppointments.find(function(item){return String(item.id)===String(appointmentId);});
      if(!appointment||!appointment.canCancel)return;
      state.lookupCancelTargetId=appointment.id;
      openDialog('Cancelar este agendamento?','O horário será liberado e a barbearia receberá um aviso por e-mail.','Confirmar cancelamento','danger',confirmLookupCancellation);
    }
    async function confirmLookupCancellation() {
      closeDialog();
      try {
        const response=unwrap(await callServer('publicCancelAppointmentByLookup',{appointmentId:state.lookupCancelTargetId,identifier:state.lookupIdentifier,sessionToken:state.lookupSessionToken}));
        state.lookupAppointments=response.appointments||[];
        state.lookupNotice='Agendamento cancelado. A barbearia foi avisada por e-mail.';
        state.lookupNoticeType='success';
        state.lookupCancelTargetId='';
        renderAppointmentLookupResults();
        showToast('success','Agendamento cancelado','A barbearia foi avisada.');
      } catch(error) {
        if(error.appCode==='CANCELLATION_WINDOW_CLOSED'){
          const appointment=state.lookupAppointments.find(function(item){return String(item.id)===String(state.lookupCancelTargetId);});
          if(appointment){appointment.canCancel=false;appointment.cancellationMessage=error.message;}
        }
        state.lookupNotice=error.message||'Não foi possível cancelar o agendamento.';
        state.lookupNoticeType='error';
        renderAppointmentLookupResults();
      }
    }
    async function lookupLegacyAppointment() {
      const message=document.getElementById('appointment-message');
      if(!INITIAL_APPOINTMENT_ID||!INITIAL_APPOINTMENT_TOKEN)return;
      message.innerHTML='<div class="alert info" role="status"><span class="spinner"></span><span>Consultando seu agendamento…</span></div>';
      try {
        const appointment=unwrap(await callServer('publicGetAppointment',{appointmentId:INITIAL_APPOINTMENT_ID,token:INITIAL_APPOINTMENT_TOKEN}));
        state.appointment=appointment;state.appointmentToken=INITIAL_APPOINTMENT_TOKEN;
        message.innerHTML='';renderAppointmentResult(appointment);
      } catch(error) {
        message.innerHTML=alertBox('error',error.message||'Verifique o link recebido na confirmação.','Não foi possível consultar:');
      }
    }
    function renderAppointmentResult(appointment) {
      const canChange=['CONFIRMED','PENDING'].indexOf(appointment.status)>=0&&appointment.canCancel!==false;
      const result=document.getElementById('appointment-result');if(!result)return;
      const isActive=['CONFIRMED','PENDING'].indexOf(appointment.status)>=0;
      const unavailable=appointment.cancellationMessage||(isActive?'O cancelamento online só pode ser feito com mais de uma hora de antecedência. Para este horário, entre em contato diretamente com a barbearia para verificar as opções.':'Este agendamento não possui ações disponíveis no momento. Se precisar de ajuda, entre em contato com a barbearia.');
      const unavailableType=appointment.status==='CONFIRMED'||appointment.status==='PENDING'?'warning':(statusTone(appointment.status)==='danger'?'warning':'info');
      result.innerHTML=ticket(appointment)+(canChange
        ? '<section class="panel reschedule-panel"><div class="panel-body"><div class="panel-heading"><div><h2>Precisa mudar?</h2><p>Escolha uma nova data e horário. O horário anterior será liberado.</p></div></div><div class="form-grid"><label class="field"><span class="field-label">Nova data</span><input id="reschedule-date" type="date" min="'+todayIso()+'"></label><label class="field"><span class="field-label">Novo horário</span><input id="reschedule-time" type="time"></label></div><div id="reschedule-message" style="margin-top:14px"></div><div class="result-actions"><button class="button primary" type="button" onclick="rescheduleAppointment()">Remarcar '+icon('calendar',15)+'</button><button class="button danger" type="button" onclick="cancelAppointment()">Cancelar agendamento</button></div></div></section>'
        : '<div style="margin-top:14px">'+alertBox(unavailableType,unavailable)+'</div>');
    }
    function cancelAppointment() { openDialog('Cancelar agendamento?','O horário será liberado e esta ação não poderá ser desfeita.','Cancelar agendamento','danger',confirmCancelAppointment); }
    async function confirmCancelAppointment() { closeDialog();try{const appointment=unwrap(await callServer('publicCancelAppointment',{appointmentId:state.appointment.id,token:state.appointmentToken}));state.appointment=appointment;renderAppointmentResult(appointment);showToast('success','Agendamento cancelado','A barbearia foi avisada por e-mail.');}catch(error){if(error.appCode==='CANCELLATION_WINDOW_CLOSED'){state.appointment.canCancel=false;state.appointment.cancellationMessage=error.message;renderAppointmentResult(state.appointment);}const message=document.getElementById('appointment-message');if(message)message.innerHTML=alertBox('error',error.message);} }
    async function rescheduleAppointment() { const date=document.getElementById('reschedule-date').value;const startTime=document.getElementById('reschedule-time').value;const message=document.getElementById('reschedule-message');if(!date||!startTime){message.innerHTML=alertBox('error','Informe a nova data e o novo horário.');return;}message.innerHTML='<div class="alert info" role="status"><span class="spinner"></span><span>Verificando disponibilidade…</span></div>';try{const result=unwrap(await callServer('publicRescheduleAppointment',{appointmentId:state.appointment.id,token:state.appointmentToken,date:date,startTime:startTime,clientId:state.clientId,browserToken:state.browserToken}));state.appointment=result.appointment;state.appointmentToken=result.managementToken;renderAppointmentResult(result.appointment);showToast('success','Agendamento remarcado','A nova data foi confirmada.');}catch(error){if(error.appCode==='CANCELLATION_WINDOW_CLOSED'){state.appointment.canCancel=false;state.appointment.cancellationMessage=error.message;renderAppointmentResult(state.appointment);}else{message.innerHTML=alertBox('error',error.message||'Escolha outro horário.','Não foi possível remarcar:');}} }
    function showToast(type,title,message) { const region=document.getElementById('toast-region');const item=document.createElement('div');item.className='toast '+type;item.innerHTML='<span class="toast-icon">'+icon(type==='success'?'check-circle':type==='error'?'alert-circle':'info',17)+'</span><span class="toast-copy"><strong>'+escapeHtml(title)+'</strong><span>'+escapeHtml(message||'')+'</span></span>';region.appendChild(item);window.setTimeout(function(){item.style.opacity='0';item.style.transform='translateY(6px)';window.setTimeout(function(){item.remove();},220);},4200); }
    function openDialog(title,message,confirmLabel,tone,action) { state.dialogAction=action;document.body.classList.add('modal-open');document.getElementById('dialog-region').innerHTML='<div class="dialog-backdrop" role="presentation" onclick="if(event.target===this)closeDialog()"><section class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialog-title"><div class="dialog-body"><h2 id="dialog-title">'+escapeHtml(title)+'</h2><p>'+escapeHtml(message)+'</p><div class="dialog-actions"><button class="button ghost" type="button" onclick="closeDialog()">Voltar</button><button class="button '+(tone==='danger'?'danger':'primary')+'" type="button" onclick="state.dialogAction()">'+escapeHtml(confirmLabel)+'</button></div></div></section></div>';window.setTimeout(function(){const button=document.querySelector('.dialog-actions .button:last-child');if(button)button.focus();},20); }
    function closeDialog() { document.body.classList.remove('modal-open');document.getElementById('dialog-region').innerHTML='';state.dialogAction=null; }
    async function boot() { try{state.bootstrap=unwrap(await callServer('publicGetBootstrap'));document.getElementById('brand-name').textContent=state.bootstrap.barberName||'Barber Booking';if(state.page==='appointment'){state.legacyAppointmentLink=Boolean(INITIAL_APPOINTMENT_ID&&INITIAL_APPOINTMENT_TOKEN);render();if(state.legacyAppointmentLink)lookupLegacyAppointment();}else{state.page='home';render();}}catch(error){document.getElementById('app').innerHTML='<div class="page"><div class="alert error" role="alert">'+icon('alert-circle',17)+'<span>Não foi possível carregar o agendamento. Tente novamente.</span></div></div>'; } }
    boot();
  </script>
</body>
</html>
