<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agendamento</title>
  <style>
    :root {
      --background: #f7f7f5;
      --surface: #ffffff;
      --surface-subtle: #f1f1ef;
      --surface-warm: #fffaf7;
      --foreground: #1c1917;
      --muted: #756f6b;

      --accent-soft: #fff1eb;
      --success: #167253;
      --success-soft: #eaf7f0;
      --warning: #a16207;
      --warning-soft: #fff8e7;
      --danger: #b42318;

      --info: #315f8a;

      --ease: cubic-bezier(.2, .75, .25, 1);

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--background); }
    body { margin: 0; color: var(--foreground); background: var(--background); font-family: "Avenir Next", "Trebuchet MS", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 15px; line-height: 1.45; font-feature-settings: "cv02", "cv03", "cv04", "cv11"; -webkit-font-smoothing: antialiased; }
    body.modal-open { overflow: hidden; }
    button, input, select, textarea { font: inherit; }
    button { border: 0; cursor: pointer; }
    button:disabled { opacity: .52; cursor: not-allowed; }
    a { color: inherit; }
    svg { display: block; flex: 0 0 auto; }
    ::selection { color: var(--primary-foreground); background: var(--accent); }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: var(--surface-subtle); }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border: 3px solid var(--surface-subtle); border-radius: 999px; }
    :focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }
    .public-shell { width: min(100%, 1080px); margin: 0 auto; padding: 0 20px 48px; }
    .site-header { min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 18px; border-bottom: 1px solid var(--border); }
    .brand-lockup { display: inline-flex; align-items: center; gap: 10px; min-width: 0; padding: 0; border: 0; color: inherit; background: transparent; text-align: left; }
    .brand-mark { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 9px; background: var(--primary); color: var(--primary-foreground); font-size: 14px; font-weight: 800; letter-spacing: -.04em; }
    .brand-copy { display: grid; gap: 0; line-height: 1.1; }
    .brand-copy strong { max-width: 230px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; letter-spacing: -.01em; }
    .brand-copy span { color: var(--muted); font-size: 11px; margin-top: 3px; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .button { min-height: 42px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 14px; border: 1px solid transparent; border-radius: var(--radius-sm); font-size: 13px; font-weight: 650; letter-spacing: -.01em; transition: background .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease), transform .18s var(--ease), box-shadow .18s var(--ease); }
    .button:hover:not(:disabled) { transform: translateY(-1px); }
    .button:active:not(:disabled) { transform: translateY(0); }
    .button.primary { background: var(--primary); color: var(--primary-foreground); box-shadow: 0 1px 2px rgba(28,25,23,.16); }
    .button.primary:hover:not(:disabled) { background: var(--primary-hover); box-shadow: var(--shadow-sm); }
    .button.secondary { background: var(--surface); color: var(--foreground); border-color: var(--border-strong); }
    .button.secondary:hover:not(:disabled) { background: var(--surface-subtle); border-color: #a8a29e; }
    .button.ghost { color: var(--muted-strong); background: transparent; }
    .button.ghost:hover:not(:disabled) { color: var(--foreground); background: var(--surface-subtle); }
    .button.danger { color: var(--danger); background: var(--danger-soft); border-color: #f7c9c5; }
    .button.danger:hover:not(:disabled) { background: #ffe4e1; }

    .page { padding-top: 44px; animation: page-in .42s var(--ease) both; }
    @keyframes page-in { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    .page-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
    .page-header h1, .page-header h2, h1, h2, h3, p { margin: 0; }
    h1 { font-size: clamp(2rem, 7vw, 3.2rem); line-height: 1.02; letter-spacing: -.055em; font-weight: 760; }
    h2 { font-size: 19px; line-height: 1.15; letter-spacing: -.035em; font-weight: 720; }
    h3 { font-size: 14px; line-height: 1.2; letter-spacing: -.02em; font-weight: 720; }
    .lede { max-width: 54ch; color: var(--muted); margin-top: 14px; font-size: 16px; }
    .muted { color: var(--muted); }
    .eyebrow { color: var(--accent-strong); font-size: 12px; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; }
    .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
    .section-heading .count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .stack { display: grid; gap: 16px; }
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .between { justify-content: space-between; }

    .note-mark { color: var(--accent); }

    .intro-note p { color: var(--muted); font-size: 13px; margin-top: 5px; }

    .service-card { display: flex; flex-direction: column; min-height: 218px; padding: 18px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-sm); transition: transform .2s var(--ease), border-color .2s var(--ease), box-shadow .2s var(--ease); }
    .service-card:hover { transform: translateY(-2px); border-color: var(--border-strong); box-shadow: var(--shadow-md); }
    .service-number { color: var(--accent); font-size: 11px; font-weight: 750; font-variant-numeric: tabular-nums; }

    .service-description { min-height: 41px; margin-top: 7px; color: var(--muted); font-size: 13px; }
    .service-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: auto; padding-top: 18px; border-top: 1px solid var(--border); }
    .service-meta span { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 12px; }
    .service-meta strong { font-size: 16px; font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
    .service-card .button { margin-top: 12px; width: 100%; }
    .how-it-works { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 38px; padding-top: 22px; border-top: 1px solid var(--border); }
    .step { display: flex; gap: 10px; align-items: flex-start; }
    .step-index { display: grid; place-items: center; flex: 0 0 auto; width: 24px; height: 24px; border: 1px solid var(--border-strong); border-radius: 7px; color: var(--muted-strong); font-size: 11px; font-weight: 750; }
    .step strong { display: block; font-size: 12px; }
    .step span { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
    .flow-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 22px; border-bottom: 1px solid var(--border); }
    .flow-steps { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; font-weight: 650; }
    .flow-step { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    .flow-step b { display: grid; place-items: center; width: 22px; height: 22px; border: 1px solid var(--border-strong); border-radius: 999px; font-size: 10px; }
    .flow-step.active { color: var(--foreground); }
    .flow-step.active b { border-color: var(--primary); background: var(--primary); color: var(--primary-foreground); }
    .flow-separator { width: 18px; height: 1px; background: var(--border-strong); }
    .booking-layout { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(300px, .85fr); gap: 18px; align-items: start; margin-top: 26px; }
    .panel { border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-sm); }
    .panel-body { padding: 22px; }
    .panel-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
    .panel-heading p { color: var(--muted); font-size: 13px; margin-top: 6px; }
    .selected-service { display: inline-flex; align-items: center; gap: 8px; padding: 7px 9px; border: 1px solid var(--border); border-radius: 8px; color: var(--muted-strong); background: var(--surface-subtle); font-size: 11px; white-space: nowrap; }
    .selected-service b { color: var(--foreground); }
    .field { display: grid; gap: 7px; }
    .field-label { color: var(--muted-strong); font-size: 12px; font-weight: 700; }
    input, select, textarea { width: 100%; min-height: 44px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface); color: var(--foreground); padding: 0 12px; outline: 0; transition: border-color .18s var(--ease), box-shadow .18s var(--ease), background .18s var(--ease); }
    textarea { min-height: 96px; padding-top: 10px; resize: vertical; }
    input::placeholder, textarea::placeholder { color: #a8a29e; }
    input:hover, select:hover, textarea:hover { border-color: #a8a29e; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
    input[type="date"] { color-scheme: light; }
    .date-picker-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; }
    .date-strip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 7px; margin-top: 14px; }
    .date-option { min-height: 70px; display: grid; place-items: center; align-content: center; gap: 4px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--muted-strong); transition: border-color .18s var(--ease), background .18s var(--ease), color .18s var(--ease), transform .18s var(--ease); }
    .date-option:hover { border-color: var(--border-strong); transform: translateY(-1px); }
    .date-option.selected { border-color: var(--primary); background: var(--primary); color: var(--primary-foreground); }
    .date-option .day { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; opacity: .72; }
    .date-option .number { font-size: 20px; font-weight: 760; line-height: 1; font-variant-numeric: tabular-nums; }
    .date-option .month { font-size: 10px; opacity: .72; }
    .availability { margin-top: 24px; }
    .availability-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .availability-heading span { color: var(--muted); font-size: 12px; }
    .slot-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .time-slot { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface); color: var(--foreground); font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums; transition: border-color .18s var(--ease), background .18s var(--ease), color .18s var(--ease), transform .18s var(--ease); }
    .time-slot:hover { border-color: var(--primary); transform: translateY(-1px); }
    .time-slot.selected { border-color: var(--primary); background: var(--primary); color: var(--primary-foreground); }
    .time-slot:disabled { background: var(--surface-subtle); color: #a8a29e; }
    .slot-empty { padding: 20px 14px; border: 1px dashed var(--border-strong); border-radius: var(--radius-sm); color: var(--muted); background: var(--surface-subtle); font-size: 13px; }
    .booking-aside { position: sticky; top: 18px; }
    .summary-card { padding: 20px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-sm); }
    .summary-card h2 { margin-bottom: 16px; }
    .summary-line { display: flex; align-items: flex-start; justify-content: space-between; gap: 15px; padding: 11px 0; border-top: 1px solid var(--border); }
    .summary-line span { color: var(--muted); font-size: 12px; }
    .summary-line strong { max-width: 58%; text-align: right; font-size: 13px; font-weight: 680; }
    .summary-note { display: flex; gap: 8px; margin-top: 16px; padding: 10px; border-radius: var(--radius-sm); background: var(--accent-soft); color: var(--accent-strong); font-size: 12px; }
    .customer-form { margin-top: 18px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .form-grid .full { grid-column: 1 / -1; }
    .form-actions { display: flex; align-items: center; gap: 9px; margin-top: 18px; }
    .form-actions .button.primary { flex: 1; }
    .field-hint { color: var(--muted); font-size: 11px; }
    .otp-field { margin-top: 14px; }
    .otp-input { letter-spacing: .35em; font-variant-numeric: tabular-nums; }
    .confirmation { max-width: 720px; margin: 18px auto 0; text-align: center; }
    .success-mark { width: 58px; height: 58px; display: grid; place-items: center; margin: 0 auto 20px; border: 1px solid #b7e4c9; border-radius: 18px; background: var(--success-soft); color: var(--success); animation: mark-in .6s var(--ease) both; }
    @keyframes mark-in { from { opacity: 0; transform: scale(.86) rotate(-7deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
    .confirmation h1 { max-width: 12ch; margin: 0 auto; }
    .confirmation > p { max-width: 45ch; margin: 13px auto 0; color: var(--muted); }
    .appointment-ticket { margin: 28px auto 0; max-width: 560px; padding: 4px 20px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-md); text-align: left; }
    .ticket-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 17px 0; }
    .ticket-head strong { display: block; font-size: 17px; letter-spacing: -.03em; }
    .ticket-head span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
    .ticket-lines { border-top: 1px dashed var(--border-strong); }
    .ticket-line { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .ticket-line:last-child { border-bottom: 0; }
    .ticket-line span { color: var(--muted); font-size: 12px; }
    .ticket-line strong { font-size: 13px; font-weight: 690; text-align: right; }
    .ticket-actions { display: flex; justify-content: center; gap: 9px; flex-wrap: wrap; margin-top: 18px; }
    .lookup { max-width: 660px; margin: 0 auto; }
    .lookup .panel-body { padding: 24px; }

    .lookup-heading p { color: var(--muted); font-size: 13px; }

    .status-badge { display: inline-flex; align-items: center; gap: 6px; min-height: 24px; padding: 0 8px; border: 1px solid var(--border); border-radius: 999px; color: var(--muted-strong); background: var(--surface-subtle); font-size: 11px; font-weight: 720; }
    .status-badge::before { width: 6px; height: 6px; content: ""; border-radius: 99px; background: currentColor; }
    .status-badge.success { color: var(--success); border-color: #b7e4c9; background: var(--success-soft); }
    .status-badge.warning { color: var(--warning); border-color: #f4d699; background: var(--warning-soft); }
    .status-badge.danger { color: var(--danger); border-color: #f7c9c5; background: var(--danger-soft); }
    .status-badge.info { color: var(--info); border-color: #c7dff2; background: var(--info-soft); }
    .result-actions { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-top: 18px; }
    .reschedule-panel { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--border); }
    .empty-state { display: grid; justify-items: start; gap: 8px; padding: 30px 22px; border: 1px dashed var(--border-strong); border-radius: var(--radius-md); color: var(--muted); background: var(--surface-subtle); }
    .empty-state .empty-icon { color: var(--accent); }
    .empty-state strong { color: var(--foreground); font-size: 14px; }
    .empty-state p { max-width: 46ch; font-size: 13px; }
    .alert { display: flex; align-items: flex-start; gap: 9px; padding: 12px 13px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; }
    .alert.info { color: var(--info); border-color: #c7dff2; background: var(--info-soft); }
    .alert.error { color: var(--danger); border-color: #f7c9c5; background: var(--danger-soft); }
    .alert.success { color: var(--success); border-color: #b7e4c9; background: var(--success-soft); }
    .alert.warning { color: var(--warning); border-color: #f4d699; background: var(--warning-soft); }
    .spinner { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 99px; animation: spin .75s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-block { display: grid; gap: 11px; padding: 6px 0; }
    .skeleton { background: linear-gradient(90deg, var(--surface-subtle) 20%, #e9e7e4 38%, var(--surface-subtle) 56%); background-size: 300% 100%; border-radius: 6px; animation: shimmer 1.5s ease-in-out infinite; }
    @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
    .skeleton-line { height: 12px; }
    .skeleton-line.short { width: 45%; }
    .skeleton-line.medium { width: 72%; }
    .skeleton-slot-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .skeleton-slot { height: 44px; }
    .toast-region { position: fixed; z-index: 40; right: 18px; bottom: 18px; display: grid; gap: 9px; width: min(360px, calc(100vw - 36px)); }
    .toast { display: flex; align-items: flex-start; gap: 10px; padding: 13px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-md); animation: toast-in .3s var(--ease) both; }
    .toast.success { border-color: #b7e4c9; }
    .toast.error { border-color: #f7c9c5; }
    .toast.warning { border-color: #f4d699; }
    .toast-icon { color: var(--accent); }
    .toast.success .toast-icon { color: var(--success); }
    .toast.error .toast-icon { color: var(--danger); }
    .toast-copy { display: grid; gap: 2px; min-width: 0; }
    .toast-copy strong { font-size: 12px; }
    .toast-copy span { color: var(--muted); font-size: 12px; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .dialog-backdrop { position: fixed; z-index: 50; inset: 0; display: grid; place-items: center; padding: 18px; background: rgba(28,25,23,.42); animation: fade-in .18s ease both; }
    .dialog { width: min(100%, 430px); border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); box-shadow: 0 22px 60px rgba(28,25,23,.18); animation: dialog-in .22s var(--ease) both; }
    .dialog-body { padding: 22px; }
    .dialog h2 { font-size: 17px; }
    .dialog p { margin-top: 7px; color: var(--muted); font-size: 13px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes dialog-in { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 54px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--muted); font-size: 11px; }
    .footer-note { display: inline-flex; align-items: center; gap: 6px; }

<body>
  <div class="public-shell">
    <header class="site-header">
      <button class="brand-lockup" type="button" aria-label="Voltar para o início" onclick="showPage('home')"><span class="brand-mark" aria-hidden="true">B</span><span class="brand-copy"><strong id="brand-name">Barber Booking</strong><span>Agendamento online</span></span></button>
      <div class="header-actions"><button class="button ghost small" type="button" onclick="showPage('appointment')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg> Consultar</button><button class="button primary small" type="button" onclick="showPage('home')">Novo agendamento</button></div>
    </header>
    <main id="app" aria-live="polite"><div class="page"><div class="loading-block"><div class="skeleton skeleton-line medium"></div><div class="skeleton skeleton-line short"></div><div class="skeleton" style="height:160px"></div></div></div></main>
    <footer><span class="footer-note"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V5l8-3 8 3v8Z"/><path d="m9 12 2 2 4-4"/></svg> Seus dados são usados apenas para o agendamento.</span><span>America/Sao_Paulo</span></footer>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div><div id="dialog-region"></div>
  <script>
    const INITIAL_PAGE = <?!= JSON.stringify(initialPage || 'home') ?>;
    const INITIAL_APPOINTMENT_ID = <?!= JSON.stringify(initialAppointmentId || '') ?>;
    const INITIAL_APPOINTMENT_TOKEN = <?!= JSON.stringify(initialAppointmentToken || '') ?>;
    const PREVIEW_MODE = !(window.google && google.script && google.script.run);
    const state = { bootstrap:null, page:INITIAL_PAGE, service:null, date:'', slot:null, availability:null, customer:null, emailVerified:false, otpSent:false, appointment:null, appointmentToken:'', dialogAction:null, clientId:storageGet('barber_booking_client_id') || createBrowserId(), browserToken:storageGet('barber_booking_browser_token') || createBrowserId() };
    storageSet('barber_booking_client_id', state.clientId); storageSet('barber_booking_browser_token', state.browserToken);
    // Preview-only data: deployed Apps Script HTML Service uses google.script.run instead.
    const MOCK_PUBLIC = { configured:true, barberName:'Ateliê do Corte', services:[{id:'SRV_001',name:'Corte clássico',description:'Acabamento preciso e finalização.',durationMinutes:40,price:40,active:true},{id:'SRV_002',name:'Barba',description:'Toalha quente, desenho e hidratação.',durationMinutes:30,price:25,active:true},{id:'SRV_003',name:'Corte + barba',description:'O cuidado completo em uma sessão.',durationMinutes:60,price:60,active:true}], settings:{BUSINESS_TIMEZONE:'America/Sao_Paulo',BOOKING_ADVANCE_DAYS:60,REQUIRE_EMAIL_VERIFICATION:false} };
    function storageGet(key) { try { return localStorage.getItem(key); } catch (error) { return ''; } }
    function storageSet(key, value) { try { localStorage.setItem(key, value); } catch (error) {} }
    function createBrowserId() { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); return 'browser-' + Date.now() + '-' + Math.random().toString(36).slice(2); }
    function escapeHtml(value) { return String(value == null ? '' : value).replace(/[&<>'"]/g, function(char) { return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]; }); }
    function money(value) { return Number(value || 0).toLocaleString('pt-BR', {style:'currency',currency:'BRL'}); }
    function todayIso() { return toIsoDate(new Date()); }
    function toIsoDate(date) { return date.getFullYear() + '-' + String(date.getMonth()+1).padStart(2,'0') + '-' + String(date.getDate()).padStart(2,'0'); }
    function parseIsoDate(value) { const parts=String(value || todayIso()).split('-').map(Number); return new Date(parts[0],parts[1]-1,parts[2]); }
    function addDays(value, amount) { const date=parseIsoDate(value); date.setDate(date.getDate()+amount); return toIsoDate(date); }
    function formatLongDate(value) { return parseIsoDate(value).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}); }
    function formatDay(value) { return parseIsoDate(value).toLocaleDateString('pt-BR',{weekday:'short'}).replace('.',''); }
    function formatStatus(status) { return ({PENDING:'Pendente',CONFIRMED:'Confirmado',COMPLETED:'Concluído',CANCELLED_BY_CLIENT:'Cancelado por você',CANCELLED_BY_BARBER:'Cancelado pela barbearia',NO_SHOW:'Não compareceu'})[status] || status || 'Não informado'; }
    function statusTone(status) { if (status==='COMPLETED' || status==='CONFIRMED') return 'success'; if (status==='PENDING') return 'warning'; if (String(status || '').indexOf('CANCELLED')===0 || status==='NO_SHOW') return 'danger'; return 'info'; }
    function icon(name, size) { const paths={ 'arrow-left':'<path d="m15 18-6-6 6-6"/><path d="M9 12h10"/>','arrow-right':'<path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>','calendar':'<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>','clock':'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>','search':'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>','check':'<path d="m5 12 4 4L19 6"/>','check-circle':'<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/>','shield-check':'<path d="M20 13c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V5l8-3 8 3v8Z"/><path d="m9 12 2 2 4-4"/>','info':'<circle cx="12" cy="12" r="9"/><path d="M12 10v6M12 7h.01"/>','scissors':'<circle cx="6" cy="7" r="3"/><circle cx="6" cy="17" r="3"/><path d="m8.5 8.5 9 7M8.5 15.5l9-7"/>','alert-circle':'<circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/>' }; return '<svg width="'+(size||18)+'" height="'+(size||18)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(paths[name]||paths.info)+'</svg>'; }
    function mockCall(name, payload) { if (name==='publicGetBootstrap') return {ok:true,data:MOCK_PUBLIC}; if (name==='publicGetAvailability') return {ok:true,data:{slots:['09:00','09:40','10:20','13:00','13:40','14:20','15:00','16:00'].map(function(startTime){return {startTime:startTime,endTime:startTime,label:startTime};})}}; if (name==='publicRequestOtp') return {ok:true,data:{required:false,alreadyVerified:true}}; if (name==='publicVerifyOtp') return {ok:true,data:{verified:true}}; if (name==='publicCreateAppointment') { const service=MOCK_PUBLIC.services.find(function(item){return item.id===payload.serviceId;})||MOCK_PUBLIC.services[0]; return {ok:true,data:{appointment:{id:'APT_PREVIEW_001',clientName:payload.name,serviceName:service.name,servicePrice:service.price,date:payload.date,startTime:payload.startTime,endTime:payload.endTime,status:'CONFIRMED',paymentStatus:'PENDING',paymentMethod:''},managementToken:'preview-token'}}; } if (name==='publicGetAppointment') return {ok:true,data:{id:payload.appointmentId||'APT_PREVIEW_001',clientName:'João Silva',serviceName:'Corte + barba',servicePrice:60,date:addDays(todayIso(),2),startTime:'14:00',endTime:'15:00',status:'CONFIRMED',paymentStatus:'PENDING',paymentMethod:''}}; if (name==='publicCancelAppointment') return {ok:true,data:Object.assign({},state.appointment,{status:'CANCELLED_BY_CLIENT'})}; if (name==='publicRescheduleAppointment') return {ok:true,data:{appointment:Object.assign({},state.appointment,{date:payload.date,startTime:payload.startTime,status:'CONFIRMED'}),managementToken:'preview-token'}}; return {ok:true,data:{}}; }
    function callServer(name, payload) { if (PREVIEW_MODE) return Promise.resolve(mockCall(name,payload||{})); return new Promise(function(resolve){ const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(function(error){resolve({ok:false,error:{code:'NETWORK_ERROR',message:error&&error.message?error.message:'Erro de comunicação.'}});}); if(payload===undefined) runner[name](); else runner[name](payload); }); }
    function unwrap(result) { if(!result || !result.ok) throw new Error(result&&result.error?result.error.message:'Não foi possível concluir a operação.'); return result.data; }
    function alertBox(type, message, label) { return '<div class="alert '+type+'" role="'+(type==='error'?'alert':'status')+'">'+icon(type==='error'?'alert-circle':type==='success'?'check-circle':'info',16)+'<span>'+(label?'<strong>'+escapeHtml(label)+'</strong> ':'')+escapeHtml(message)+'</span></div>'; }
    function loadingAvailability() { return '<div class="loading-block"><div class="skeleton skeleton-line short"></div><div class="skeleton-slot-grid"><div class="skeleton skeleton-slot"></div><div class="skeleton skeleton-slot"></div><div class="skeleton skeleton-slot"></div><div class="skeleton skeleton-slot"></div><div class="skeleton skeleton-slot"></div><div class="skeleton skeleton-slot"></div></div></div>'; }
    function showPage(page) { state.page=page; if(page==='home'){state.service=null;state.slot=null;state.availability=null;state.otpSent=false;} render(); if(page==='appointment'&&INITIAL_APPOINTMENT_ID&&!state.appointment){const idField=document.getElementById('appointment-id');const tokenField=document.getElementById('appointment-token');if(idField)idField.value=INITIAL_APPOINTMENT_ID;if(tokenField)tokenField.value=INITIAL_APPOINTMENT_TOKEN;lookupAppointment();} }
    function render() { const app=document.getElementById('app'); if(!state.bootstrap){app.innerHTML='<div class="page"><div class="loading-block"><div class="skeleton skeleton-line medium"></div><div class="skeleton skeleton-line short"></div><div class="skeleton" style="height:160px"></div></div></div>';return;} if(!state.bootstrap.configured){app.innerHTML='<div class="page"><section class="empty-state"><span class="empty-icon">'+icon('scissors',22)+'</span><strong>Agendamentos online em preparação</strong><p>'+escapeHtml(state.bootstrap.message||'O barbeiro ainda precisa concluir a configuração do sistema.')+'</p></section></div>';return;} if(state.page==='booking')app.innerHTML=bookingPage();else if(state.page==='confirmation')app.innerHTML=confirmationPage();else if(state.page==='appointment')app.innerHTML=appointmentPage();else app.innerHTML=homePage(); }
    function homePage() { const services=state.bootstrap.services||[]; return '<div class="page"><section class="intro-grid"><div><span class="eyebrow">'+escapeHtml(state.bootstrap.barberName||'Barbearia')+'</span><h1 style="margin-top:11px">Agende seu próximo horário.</h1><p class="lede">Escolha um serviço, encontre um horário que funcione para você e confirme em poucos passos.</p></div><aside class="intro-note"><div><span class="note-mark">'+icon('scissors',18)+'</span><strong>Atendimento simples, sem espera.</strong><p>Você escolhe o serviço e recebe os dados da reserva por e-mail.</p></div><span class="meta-line">'+icon('shield-check',15)+' Sem senha ou cadastro</span></aside></section><section><div class="section-heading"><h2>Serviços disponíveis</h2><span class="count">'+services.length+' opção'+(services.length===1?'':'ões')+'</span></div>'+(services.length?'<div class="service-list">'+services.map(function(service,index){return '<article class="service-card"><span class="service-number">0'+(index+1)+'</span><h3>'+escapeHtml(service.name)+'</h3><p class="service-description">'+escapeHtml(service.description||'Atendimento na barbearia.')+'</p><div class="service-meta"><span>'+icon('clock',13)+' '+service.durationMinutes+' min</span><strong>'+money(service.price)+'</strong></div><button class="button primary" type="button" onclick="chooseService(\''+escapeHtml(service.id)+'\')">Escolher horário '+icon('arrow-right',15)+'</button></article>';}).join('')+'</div>':'<div class="empty-state"><span class="empty-icon">'+icon('scissors',22)+'</span><strong>Nenhum serviço disponível ainda.</strong><p>Assim que a barbearia cadastrar um serviço, ele aparecerá aqui.</p></div>')+'</section><section class="how-it-works"><div class="step"><span class="step-index">1</span><div><strong>Escolha</strong><span>Serviço e horário.</span></div></div><div class="step"><span class="step-index">2</span><div><strong>Informe seus dados</strong><span>Nome, telefone e e-mail.</span></div></div><div class="step"><span class="step-index">3</span><div><strong>Confirme</strong><span>Receba seu comprovante.</span></div></div></section></div>'; }
    function chooseService(serviceId) { state.service=(state.bootstrap.services||[]).find(function(item){return item.id===serviceId;}); state.date=todayIso(); state.slot=null; state.availability=null; state.customer=null; state.otpSent=false; state.page='booking'; render(); loadAvailability(); }
    function flowSteps(active) { return '<div class="flow-steps"><span class="flow-step '+(active>=1?'active':'')+'"><b>1</b><span>Serviço</span></span><i class="flow-separator"></i><span class="flow-step '+(active>=2?'active':'')+'"><b>2</b><span>Data e horário</span></span><i class="flow-separator"></i><span class="flow-step '+(active>=3?'active':'')+'"><b>3</b><span>Seus dados</span></span></div>'; }
    function dateStrip() { const selected=state.date||todayIso(); let html=''; for(let index=0;index<5;index+=1){const date=addDays(selected,index);html+='<button class="date-option '+(date===selected?'selected':'')+'" type="button" onclick="setBookingDate(\''+date+'\')"><span class="day">'+escapeHtml(formatDay(date))+'</span><span class="number">'+parseIsoDate(date).getDate()+'</span><span class="month">'+escapeHtml(parseIsoDate(date).toLocaleDateString('pt-BR',{month:'short'}).replace('.',''))+'</span></button>'; } return html; }
    function bookingPage() { const service=state.service;if(!service)return homePage();const activeStep=state.slot?3:2;return '<div class="page"><div class="flow-bar"><button class="button ghost small" type="button" onclick="showPage(\'home\')">'+icon('arrow-left',15)+' Serviços</button>'+flowSteps(activeStep)+'</div><div class="booking-layout"><section class="panel"><div class="panel-body"><div class="panel-heading"><div><h1 style="font-size:clamp(1.65rem, 5vw, 2.35rem)">Escolha data e horário.</h1><p>Veja os horários livres para o serviço escolhido.</p></div><span class="selected-service"><b>'+escapeHtml(service.name)+'</b><span>'+service.durationMinutes+' min</span></span></div><div class="field"><span class="field-label">Escolha uma data</span><div class="date-picker-row"><input id="booking-date" type="date" min="'+todayIso()+'" max="'+addDays(todayIso(),Number(state.bootstrap.settings.BOOKING_ADVANCE_DAYS||60))+'" value="'+escapeHtml(state.date||todayIso())+'" onchange="dateChanged()"><span class="meta-line">'+icon('calendar',15)+' '+escapeHtml(formatLongDate(state.date||todayIso()))+'</span></div><div class="date-strip">'+dateStrip()+'</div></div><div id="availability" class="availability">'+(state.availability?availabilityHtml(state.availability):loadingAvailability())+'</div></div></section><aside class="booking-aside"><section class="summary-card"><h2>Resumo do serviço</h2><div class="summary-line"><span>Serviço</span><strong>'+escapeHtml(service.name)+'</strong></div><div class="summary-line"><span>Duração</span><strong>'+service.durationMinutes+' min</strong></div><div class="summary-line"><span>Valor</span><strong>'+money(service.price)+'</strong></div><div class="summary-note">'+icon('info',15)+'<span>O horário só fica reservado depois da confirmação dos seus dados.</span></div></section>'+(state.slot?customerForm():'<div class="empty-state" style="margin-top:18px"><span class="empty-icon">'+icon('clock',22)+'</span><strong>Escolha um horário para continuar</strong><p>Os próximos passos aparecem aqui assim que você selecionar um slot.</p></div>')+'</aside></div></div>'; }
    function setBookingDate(date) { state.date=date;state.slot=null;state.availability=null;render();loadAvailability(); }
    function dateChanged() { const field=document.getElementById('booking-date');state.date=field&&field.value?field.value:todayIso();state.slot=null;state.availability=null;render();loadAvailability(); }
    function availabilityHtml(data) { const slots=data&&data.slots?data.slots:[];if(!slots.length)return '<div class="availability-heading"><h3>Horários disponíveis</h3><span>0 encontrados</span></div><div class="slot-empty">Não há horários disponíveis nesta data. Escolha outro dia para continuar.</div>';return '<div class="availability-heading"><h3>Horários disponíveis</h3><span>'+slots.length+' encontrados</span></div><div class="slot-grid">'+slots.map(function(slot){return '<button class="time-slot '+(state.slot&&state.slot.startTime===slot.startTime?'selected':'')+'" type="button" onclick="chooseSlot(\''+escapeHtml(slot.startTime)+'\',\''+escapeHtml(slot.endTime)+'\')">'+escapeHtml(slot.label||slot.startTime)+'</button>';}).join('')+'</div>'; }
    async function loadAvailability() { if(!state.service||!state.date)return;const target=document.getElementById('availability');if(target)target.innerHTML=loadingAvailability();try{state.availability=unwrap(await callServer('publicGetAvailability',{date:state.date,serviceId:state.service.id}));const next=document.getElementById('availability');if(next)next.innerHTML=availabilityHtml(state.availability);}catch(error){const next=document.getElementById('availability');if(next)next.innerHTML=alertBox('error',error.message||'Não foi possível consultar os horários.','Falha ao carregar:');} }
    function chooseSlot(startTime,endTime) { state.slot={startTime:startTime,endTime:endTime};render();window.setTimeout(function(){const field=document.getElementById('customer-name');if(field)field.focus();},40); }
    function customerForm() { const customer=state.customer||{};return '<section class="panel customer-form"><div class="panel-body"><div class="panel-heading"><div><h2>Seus dados</h2><p>Usaremos estas informações para enviar a confirmação.</p></div><span class="status-badge info">3 de 3</span></div><div class="form-grid"><label class="field"><span class="field-label">Nome completo</span><input id="customer-name" autocomplete="name" required maxlength="120" placeholder="Como podemos chamar você?" value="'+escapeHtml(customer.name||'')+'"></label><label class="field"><span class="field-label">Telefone</span><input id="customer-phone" autocomplete="tel" required inputmode="tel" placeholder="(00) 00000-0000" value="'+escapeHtml(customer.phone||'')+'"></label><label class="field full"><span class="field-label">E-mail</span><input id="customer-email" autocomplete="email" required type="email" placeholder="voce@email.com" value="'+escapeHtml(customer.email||'')+'"></label>'+(state.otpSent?'<label class="field full otp-field"><span class="field-label">Código de confirmação</span><input id="customer-otp" class="otp-input" inputmode="numeric" maxlength="6" placeholder="000000" aria-describedby="otp-hint"><span id="otp-hint" class="field-hint">Enviamos um código de 6 dígitos para o seu e-mail.</span></label>':'')+'</div><div id="customer-message" style="margin-top:14px"></div><div class="form-actions"><button class="button primary" type="button" onclick="submitCustomer()">'+(state.otpSent?'Validar e confirmar '+icon('check',15):'Confirmar agendamento '+icon('arrow-right',15))+'</button><button class="button ghost" type="button" onclick="state.slot=null;render()">Escolher outro horário</button></div></div></section>'; }
    function readCustomer() { return {name:document.getElementById('customer-name').value.trim(),phone:document.getElementById('customer-phone').value.trim(),email:document.getElementById('customer-email').value.trim(),clientId:state.clientId,browserToken:state.browserToken}; }
    function validateCustomer(customer) { if(!customer.name||customer.name.length<2)return 'Informe seu nome completo.';if(!customer.phone||customer.phone.replace(/\D/g,'').length<8)return 'Informe um telefone válido.';if(!/^\S+@\S+\.\S+$/.test(customer.email))return 'Informe um e-mail válido.';return ''; }
    async function submitCustomer() { const customer=readCustomer();state.customer=customer;const message=document.getElementById('customer-message');const validation=validateCustomer(customer);if(validation){message.innerHTML=alertBox('error',validation,'Confira os dados:');return;}message.innerHTML='<div class="alert info" role="status"><span class="spinner"></span><span>Processando seu agendamento…</span></div>';try{if(state.bootstrap.settings.REQUIRE_EMAIL_VERIFICATION&&!state.emailVerified){if(!state.otpSent){const response=unwrap(await callServer('publicRequestOtp',customer));if(response.required){state.otpSent=true;render();window.setTimeout(function(){const field=document.getElementById('customer-otp');if(field)field.focus();},40);return;}state.emailVerified=true;}else{const code=document.getElementById('customer-otp').value.trim();unwrap(await callServer('publicVerifyOtp',Object.assign({},customer,{code:code})));state.emailVerified=true;}}const result=unwrap(await callServer('publicCreateAppointment',Object.assign({},customer,{date:state.date,startTime:state.slot.startTime,endTime:state.slot.endTime,serviceId:state.service.id})));state.appointment=result.appointment;state.appointmentToken=result.managementToken;state.page='confirmation';render();showToast('success','Agendamento confirmado','Seu horário foi reservado com sucesso.');}catch(error){message.innerHTML=alertBox('error',error.message||'Não foi possível concluir o agendamento.','Não foi possível confirmar:');} }
    function ticket(appointment) { return '<section class="appointment-ticket"><div class="ticket-head"><div><strong>'+escapeHtml(appointment.serviceName)+'</strong><span>'+formatStatus(appointment.status)+'</span></div><span class="status-badge '+statusTone(appointment.status)+'">'+escapeHtml(formatStatus(appointment.status))+'</span></div><div class="ticket-lines"><div class="ticket-line"><span>Cliente</span><strong>'+escapeHtml(appointment.clientName||(state.customer&&state.customer.name)||'')+'</strong></div><div class="ticket-line"><span>Data</span><strong>'+escapeHtml(formatLongDate(appointment.date))+'</strong></div><div class="ticket-line"><span>Horário</span><strong>'+escapeHtml(appointment.startTime)+' – '+escapeHtml(appointment.endTime)+'</strong></div><div class="ticket-line"><span>Valor</span><strong>'+money(appointment.servicePrice)+'</strong></div></div></section>'; }
    function confirmationPage() { const appointment=state.appointment;if(!appointment)return homePage();const url=location.href.split('?')[0]+'?page=appointment&id='+encodeURIComponent(appointment.id)+'&token='+encodeURIComponent(state.appointmentToken);return '<div class="page confirmation"><span class="success-mark">'+icon('check',28)+'</span><h1>Agendamento confirmado.</h1><p>Seu horário está reservado. Guarde este link para consultar ou cancelar quando precisar.</p>'+ticket(appointment)+'<div class="ticket-actions"><a class="button secondary" href="'+url+'">'+icon('search',15)+' Consultar agendamento</a><button class="button primary" type="button" onclick="showPage(\'home\')">Novo agendamento '+icon('arrow-right',15)+'</button></div></div>'; }
    function appointmentPage() { return '<div class="page lookup"><section class="panel"><div class="panel-body"><div class="lookup-heading"><span class="eyebrow">Consulta</span><h1 style="font-size:clamp(1.9rem, 6vw, 2.6rem)">Encontre seu agendamento.</h1><p>Informe o identificador e o token recebidos na confirmação.</p></div><div class="form-grid"><label class="field"><span class="field-label">Identificador</span><input id="appointment-id" autocomplete="off" placeholder="APT_..."></label><label class="field"><span class="field-label">Token de acesso</span><input id="appointment-token" autocomplete="off" type="password" placeholder="Token seguro"></label></div><div id="appointment-message" style="margin-top:14px"></div><div class="form-actions"><button class="button primary" type="button" onclick="lookupAppointment()">Consultar '+icon('search',15)+'</button><button class="button ghost" type="button" onclick="showPage(\'home\')">Voltar para serviços</button></div></div></section><div id="appointment-result" class="lookup-result"></div></div>'; }
    async function lookupAppointment() { const id=(document.getElementById('appointment-id')||{}).value||'';const token=(document.getElementById('appointment-token')||{}).value||'';const message=document.getElementById('appointment-message');if(!id.trim()||!token.trim()){message.innerHTML=alertBox('error','Informe o identificador e o token para continuar.');return;}message.innerHTML='<div class="alert info" role="status"><span class="spinner"></span><span>Consultando seu agendamento…</span></div>';try{const appointment=unwrap(await callServer('publicGetAppointment',{appointmentId:id.trim(),token:token.trim()}));state.appointment=appointment;state.appointmentToken=token.trim();message.innerHTML='';renderAppointmentResult(appointment);}catch(error){message.innerHTML=alertBox('error',error.message||'Verifique os dados informados.','Não foi possível consultar:');} }
    function renderAppointmentResult(appointment) { const canChange=['CONFIRMED','PENDING'].indexOf(appointment.status)>=0;const result=document.getElementById('appointment-result');if(!result)return;result.innerHTML=ticket(appointment)+(canChange?'<section class="panel reschedule-panel"><div class="panel-body"><div class="panel-heading"><div><h2>Precisa mudar?</h2><p>Escolha uma nova data e horário. O horário anterior será liberado.</p></div></div><div class="form-grid"><label class="field"><span class="field-label">Nova data</span><input id="reschedule-date" type="date" min="'+todayIso()+'"></label><label class="field"><span class="field-label">Novo horário</span><input id="reschedule-time" type="time"></label></div><div id="reschedule-message" style="margin-top:14px"></div><div class="result-actions"><button class="button primary" type="button" onclick="rescheduleAppointment()">Remarcar '+icon('calendar',15)+'</button><button class="button danger" type="button" onclick="cancelAppointment()">Cancelar agendamento</button></div></div></section>':'<div style="margin-top:14px">'+alertBox(statusTone(appointment.status)==='danger'?'warning':'info','Este agendamento não possui ações disponíveis no momento.')+'</div>'); }
    function cancelAppointment() { openDialog('Cancelar agendamento?','O horário será liberado e esta ação não poderá ser desfeita.','Cancelar agendamento','danger',confirmCancelAppointment); }
    async function confirmCancelAppointment() { closeDialog();try{const appointment=unwrap(await callServer('publicCancelAppointment',{appointmentId:state.appointment.id,token:state.appointmentToken}));state.appointment=appointment;renderAppointmentResult(appointment);showToast('success','Agendamento cancelado','O horário foi liberado.');}catch(error){const message=document.getElementById('appointment-message');if(message)message.innerHTML=alertBox('error',error.message);} }
    async function rescheduleAppointment() { const date=document.getElementById('reschedule-date').value;const startTime=document.getElementById('reschedule-time').value;const message=document.getElementById('reschedule-message');if(!date||!startTime){message.innerHTML=alertBox('error','Informe a nova data e o novo horário.');return;}message.innerHTML='<div class="alert info" role="status"><span class="spinner"></span><span>Verificando disponibilidade…</span></div>';try{const result=unwrap(await callServer('publicRescheduleAppointment',{appointmentId:state.appointment.id,token:state.appointmentToken,date:date,startTime:startTime,clientId:state.clientId,browserToken:state.browserToken}));state.appointment=result.appointment;state.appointmentToken=result.managementToken;renderAppointmentResult(result.appointment);showToast('success','Agendamento remarcado','A nova data foi confirmada.');}catch(error){message.innerHTML=alertBox('error',error.message||'Escolha outro horário.','Não foi possível remarcar:');} }
    function showToast(type,title,message) { const region=document.getElementById('toast-region');const item=document.createElement('div');item.className='toast '+type;item.innerHTML='<span class="toast-icon">'+icon(type==='success'?'check-circle':type==='error'?'alert-circle':'info',17)+'</span><span class="toast-copy"><strong>'+escapeHtml(title)+'</strong><span>'+escapeHtml(message||'')+'</span></span>';region.appendChild(item);window.setTimeout(function(){item.style.opacity='0';item.style.transform='translateY(6px)';window.setTimeout(function(){item.remove();},220);},4200); }
    function openDialog(title,message,confirmLabel,tone,action) { state.dialogAction=action;document.body.classList.add('modal-open');document.getElementById('dialog-region').innerHTML='<div class="dialog-backdrop" role="presentation" onclick="if(event.target===this)closeDialog()"><section class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialog-title"><div class="dialog-body"><h2 id="dialog-title">'+escapeHtml(title)+'</h2><p>'+escapeHtml(message)+'</p><div class="dialog-actions"><button class="button ghost" type="button" onclick="closeDialog()">Voltar</button><button class="button '+(tone==='danger'?'danger':'primary')+'" type="button" onclick="state.dialogAction()">'+escapeHtml(confirmLabel)+'</button></div></div></section></div>';window.setTimeout(function(){const button=document.querySelector('.dialog-actions .button:last-child');if(button)button.focus();},20); }
    function closeDialog() { document.body.classList.remove('modal-open');document.getElementById('dialog-region').innerHTML='';state.dialogAction=null; }
    async function boot() { try{state.bootstrap=unwrap(await callServer('publicGetBootstrap'));document.getElementById('brand-name').textContent=state.bootstrap.barberName||'Barber Booking';if(state.page==='appointment'){render();if(INITIAL_APPOINTMENT_ID){document.getElementById('appointment-id').value=INITIAL_APPOINTMENT_ID;document.getElementById('appointment-token').value=INITIAL_APPOINTMENT_TOKEN;lookupAppointment();}}else{state.page='home';render();}}catch(error){document.getElementById('app').innerHTML='<div class="page"><div class="alert error" role="alert">'+icon('alert-circle',17)+'<span>Não foi possível carregar o agendamento. Tente novamente.</span></div></div>'; } }
    boot();
  </script>
</body>
</html>
